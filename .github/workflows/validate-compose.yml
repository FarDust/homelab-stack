name: 🧪 Validate Docker Compose Files

on:
  pull_request:
    paths:
      - 'stacks/**/*.yml'
      - '.env.example'
      - '.github/workflows/validate-compose.yml'
  push:
    branches:
      - main
    paths:
      - 'stacks/**/*.yml'
      - '.env.example'

jobs:
  validate:
    name: docker compose config
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: 🐳 Validate all stack compose files
        run: |
          set -euo pipefail

          # Source .env.example to load all variable defaults.
          # The two dynamic lines use parameter expansion with fallbacks so they are
          # safe in CI (git config and /etc/timezone may return empty).
          set -a
          source .env.example
          set +a

          failed=0
          while IFS= read -r -d '' f; do
            echo -n "  checking $f ... "
            if docker compose -f "$f" config --quiet 2>/dev/null; then
              echo "✅"
            else
              docker compose -f "$f" config --quiet 2>&1 | grep -v '^WARN\|level=warning' | head -3
              echo "❌"
              failed=1
            fi
          done < <(find stacks -maxdepth 2 -name '*.yml' ! -path '*/configs/*' -print0 | sort -z)
          [ "$failed" -eq 0 ]

      - name: 🔍 Assert ragflow service configuration
        run: |
          set -euo pipefail
          set -a; source .env.example; set +a

          rendered=$(docker compose -f stacks/retrieval/documents.yml config 2>/dev/null)

          # Ensure the unsupported flag was removed
          if echo "$rendered" | grep -q -- '--init-superuser'; then
            echo "❌ --init-superuser still present in rendered ragflow command!"
            exit 1
          fi
          echo "✅ --init-superuser correctly absent from ragflow command"

          # Ensure all required MCP env vars are present as key: value assignments
          for var in MCP_HOST MCP_PORT MCP_BASE_URL MCP_MODE MCP_API_KEY; do
            if echo "$rendered" | grep -qE "^[[:space:]]+${var}:"; then
              echo "✅ $var present"
            else
              echo "❌ $var missing from rendered ragflow config!"
              exit 1
            fi
          done
