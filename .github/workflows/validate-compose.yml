name: 🧪 Validate Docker Compose Files

on:
  pull_request:
    paths:
      - 'stacks/productivity/browser-lab.yml'
      - '.env.example'
      - '.github/workflows/validate-compose.yml'
      - '.github/workflows/check-productivity-browser-lab.yml'
  push:
    branches:
      - main
    paths:
      - 'stacks/productivity/browser-lab.yml'
      - '.env.example'

jobs:
  # ── Step 1: generic render check ──────────────────────────────────────────
  validate:
    name: productivity/browser-lab
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: 🐳 docker compose config
        run: |
          set -euo pipefail
          set -a; source .env.example; set +a
          docker compose -f stacks/productivity/browser-lab.yml config --quiet

  # ── Step 2: domain-specific static checks ─────────────────────────────────
  check-productivity-browser-lab:
    name: 🔍 productivity/browser-lab
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/check-productivity-browser-lab.yml
