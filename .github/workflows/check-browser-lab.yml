name: 🧪 Test browser-lab stack

on:
  pull_request:
    paths:
      - "stacks/productivity/browser-lab.yml"
      - ".github/workflows/check-browser-lab.yml"

jobs:
  validate-compose:
    name: Validate compose config
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v4

      - name: 🔍 Validate browser-lab compose
        working-directory: stacks/productivity
        env:
          LOCAL_DOMAIN: local.example.com
          USER_TIMEZONE: UTC
          GCS_SYNC_STORAGE_BUCKET: test-bucket
          BROWSER_LAB_TURN_HOST: turn.local.example.com
          BROWSER_LAB_TURN_PORT: "3478"
          BROWSER_LAB_TURN_USER: neko
          BROWSER_LAB_TURN_EXTERNAL_IP: "127.0.0.1"
          BROWSER_LAB_TURN_REALM: local.example.com
          BROWSER_LAB_TURN_PASSWORD: test-password
          BROWSER_LAB_NEKO_USER_PASSWORD: test-user-pass
          BROWSER_LAB_NEKO_ADMIN_PASSWORD: test-admin-pass
        run: docker compose -f browser-lab.yml config --quiet
