repos:
    - repo: local
      hooks:
          - id: check-no-local-paths
            name: check-no-local-paths
            entry: scripts/check-no-local-paths.sh
            language: system
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v4.2.0
      hooks:
          - id: end-of-file-fixer
          - id: trailing-whitespace
          - id: check-added-large-files
            args: ['--maxkb=1000']
          - id: check-json
          - id: detect-private-key
          - id: end-of-file-fixer
          - id: mixed-line-ending
          - id: trailing-whitespace
    - repo: https://github.com/dotenv-linter/dotenv-linter
      rev: v4.0.0
      hooks:
          - id: dotenv-linter
            args: ['check', '--ignore-checks', 'LeadingCharacter,UnorderedKey,ValueWithoutQuotes,SubstitutionKey']
            exclude: '\.env\.template$'
    - repo: local
      hooks:
          - id: ggshield-quota-guard
            name: ggshield with independently confirmed quota guard
            entry: uv run --script scripts/secret_scan_guard.py pre-commit
            language: system
            pass_filenames: false
            stages: [pre-commit]
    - repo: https://github.com/gitleaks/gitleaks
      rev: v8.30.1
      hooks:
          - id: gitleaks
            language: system
            stages: [pre-commit]
