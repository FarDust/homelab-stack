repos:
    - repo: local
      hooks:
          - id: check-no-local-paths
            name: check-no-local-paths
            entry: scripts/check-no-local-paths.sh
            language: system
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v4.2.0
      hooks:
          - id: end-of-file-fixer
          - id: trailing-whitespace
          - id: check-added-large-files
            args: ['--maxkb=1000']
          - id: check-json
          - id: detect-private-key
          - id: end-of-file-fixer
          - id: mixed-line-ending
          - id: trailing-whitespace
    # Prebuilt-image runner; the upstream hook (language: docker) compiles
    # dotenv-linter from source on every environment rebuild. As decided in
    # docs/adr/pre_commit_dotenv_linter_prebuilt_adr.md
    - repo: local
      hooks:
          - id: dotenv-linter
            name: dotenv-linter (prebuilt image)
            entry: scripts/dotenv-lint.sh
            language: system
            files: '\.env*'
            exclude: '\.env\.template$'
            types: [text]
            args: ['check', '--ignore-checks', 'LeadingCharacter,UnorderedKey,ValueWithoutQuotes,SubstitutionKey,LowercaseKey']
    - repo: local
      hooks:
          - id: ggshield-quota-guard
            name: ggshield with independently confirmed quota guard
            entry: uv run --python 3.12 --script scripts/secret_scan_guard.py pre-commit
            language: system
            pass_filenames: false
            stages: [pre-commit]
    # Rejects private deployment indicators and forbidden paths in what a commit adds. As decided in
    # docs/adr/private_indicator_guard_adr.md
    - repo: local
      hooks:
          - id: check-private-indicators
            name: check-private-indicators
            entry: uv run --script scripts/check_private_indicators.py
            language: system
            pass_filenames: false
            stages: [pre-commit]
    # Keeps config/env-contract.yaml, the stacks and .env.example in step. As decided in docs/adr/env_contract_adr.md
    - repo: local
      hooks:
          - id: env-contract
            name: env-contract
            entry: uv run --script scripts/env_contract.py check
            language: system
            pass_filenames: false
            files: '^(stacks/[^/]+/[^/]+\.ya?ml|config/env-contract\.yaml|\.env\.example|scripts/env_contract\.py)$'
            stages: [pre-commit]
    - repo: https://github.com/gitleaks/gitleaks
      rev: v8.30.1
      hooks:
          - id: gitleaks
            language: system
            entry: >-
              bash -c 'version="$(gitleaks version)" || exit $?;
              if [ "$version" != "8.30.1" ]; then
              printf "Gitleaks 8.30.1 required; found %s\n" "$version" >&2; exit 1; fi;
              exec gitleaks git --pre-commit --redact --staged --verbose'
            stages: [pre-commit]
