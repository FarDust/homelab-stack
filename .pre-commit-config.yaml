repos:
    - repo: local
      hooks:
          - id: check-no-local-paths
            name: check-no-local-paths
            entry: scripts/check-no-local-paths.sh
            language: system
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v4.2.0
      hooks:
          - id: end-of-file-fixer
          - id: trailing-whitespace
          - id: check-added-large-files
            args: ['--maxkb=1000']
          - id: check-json
          - id: detect-private-key
          - id: end-of-file-fixer
          - id: mixed-line-ending
          - id: trailing-whitespace
    - repo: https://github.com/dotenv-linter/dotenv-linter
      rev: v4.0.0
      hooks:
          - id: dotenv-linter
            args: ['check', '--ignore-checks', 'LeadingCharacter,UnorderedKey,ValueWithoutQuotes,SubstitutionKey,ExtraBlankLine,SpaceCharacter']
            exclude: '\.env\.template$'
    - repo: https://github.com/gitguardian/ggshield
      rev: v1.27.0
      hooks:
          - id: ggshield
            language_version: python3
            stages: [pre-commit]
