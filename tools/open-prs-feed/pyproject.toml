[project]
name = "open-prs-feed"
version = "0.1.0"
description = "Writes the open pull request list that node-retention reads, atomically and only from a complete, validated snapshot."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.7",
    "typer>=0.12",
    "rich>=13.9",
]

[project.scripts]
open-prs-feed = "open_prs_feed.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_prs_feed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }]

[tool.ruff]
line-length = 120
[tool.ruff.lint]
select = ["E","F","I","UP","B","RUF"]
ignore = ["E501"]

[tool.ruff.format]
line-ending = "lf"
