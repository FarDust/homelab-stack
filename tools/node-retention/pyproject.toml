[project]
name = "node-retention"
version = "0.3.0"
description = "Standing disk retention policy for CI/build worker nodes: plan, apply, ledger and Prometheus textfile metrics."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "typer>=0.12",
    "rich>=13.9",
]

[project.scripts]
node-retention = "node_retention.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/node_retention"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 120
[tool.ruff.lint]
select = ["E","F","I","UP","B","RUF"]
ignore = ["E501"]

[tool.ruff.format]
line-ending = "lf"
