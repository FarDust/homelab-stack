# Typed contract for the environment variables the compose stacks interpolate. Names, kinds, owners and file-name
# patterns only: no values. Validated by scripts/env_contract.py; see docs/adr/env_contract_adr.md.
version: 1
variables:
- name: AGENTA_DB_URL
  kind: literal
  owner: external
  used_by: []
  external_consumers:
  - unreferenced-in-tracked-files
  required: true
  description: agenta db url; read by unreferenced-in-tracked-files, not by a stack.
  example: your_agenta_db_url
- name: ANYTHINGLLM_JWT_SECRET
  kind: literal
  owner: llms/governance
  used_by:
  - llms/governance
  required: true
  description: anythingllm jwt secret setting for llms/governance.
  example: your_anythingllm_jwt_secret
- name: ANYTHINGLLM_OPENAI_API_KEY
  kind: literal
  owner: llms/governance
  used_by:
  - llms/governance
  required: true
  description: Can be same as OPENAI_API_KEY
  example: your_anythingllm_openai_api_key
- name: ARTIFACTS_GCS_BUCKET
  kind: literal
  owner: main/logging
  used_by:
  - main/logging
  - main/maintenance
  required: true
  description: Shared artifact bucket (loki/cluster/backup prefix holds Loki archives)
  example: your_shared_artifacts_bucket
- name: AUTHELIA_DUO_API_HOSTNAME
  kind: literal
  owner: main/traefik
  used_by:
  - main/traefik
  required: true
  description: From Duo Security Admin Panel
  example: api-xxxxxxxx.duosecurity.com
- name: AUTHELIA_PREFIX
  kind: literal
  owner: main/traefik
  used_by:
  - main/traefik
  required: true
  description: Subdomain prefix for Authelia
  example: auth
- name: AUTHELIA_SMTP_FROM
  kind: literal
  owner: main/traefik
  used_by:
  - main/traefik
  required: true
  description: Email address for Authelia notifications
  example: auth@yourdomain.com
- name: BEEAI_ADMIN_PASSWORD
  kind: literal
  owner: external
  used_by: []
  external_consumers:
  - clusters/llms
  required: true
  description: beeai admin password; read by clusters/llms, not by a stack.
  example: your_beeai_admin_password
- name: BEEAI_DB_PASSWORD
  kind: secret-file
  owner: external
  used_by: []
  external_consumers:
  - unreferenced-in-tracked-files
  required: true
  description: beeai db password; read by unreferenced-in-tracked-files, not by a stack.
  secret_file: beeai/db_password
- name: BEEAI_DB_URL
  kind: literal
  owner: external
  used_by: []
  external_consumers:
  - unreferenced-in-tracked-files
  required: true
  description: beeai db url; read by unreferenced-in-tracked-files, not by a stack.
  example: your_beeai_db_url
- name: BEEAI_ENCRYPTION_KEY
  kind: secret-file
  owner: external
  used_by: []
  external_consumers:
  - clusters/llms
  required: true
  description: beeai encryption key; read by clusters/llms, not by a stack.
  secret_file: beeai/encryption_key
- name: BLOCK_MEDIA
  kind: literal
  owner: compute/execution
  used_by:
  - compute/execution
  required: false
  default: ''
  description: block media setting for compute/execution.
  example: ''
- name: BROWSER_LAB_NEKO_ADMIN_PASSWORD
  kind: secret-file
  owner: productivity/.tmp_service_deploy_browser-neko-brave
  used_by:
  - productivity/.tmp_service_deploy_browser-neko-brave
  - productivity/browser-lab
  required: true
  description: 'Neko admin password (Generate: openssl rand -hex 16)'
  secret_file: unassigned/browser_lab_neko_admin_password
- name: BROWSER_LAB_NEKO_SCREEN
  kind: literal
  owner: productivity/.tmp_service_deploy_browser-neko-brave
  used_by:
  - productivity/.tmp_service_deploy_browser-neko-brave
  - productivity/browser-lab
  required: false
  default: 1920x1080@30
  description: Neko desktop resolution
  example: 1920x1080@30
- name: BROWSER_LAB_NEKO_USER_PASSWORD
  kind: secret-file
  owner: productivity/.tmp_service_deploy_browser-neko-brave
  used_by:
  - productivity/.tmp_service_deploy_browser-neko-brave
  - productivity/browser-lab
  required: true
  description: 'Neko user password (Generate: openssl rand -hex 16)'
  secret_file: unassigned/browser_lab_neko_user_password
- name: BROWSER_LAB_TURN_EXTERNAL_IP
  kind: computed
  owner: productivity/browser-lab
  used_by:
  - productivity/browser-lab
  required: true
  description: Public/external IP of the TURN server node
  example: 0.0.0.0
- name: BROWSER_LAB_TURN_HOST
  kind: literal
  owner: productivity/.tmp_service_deploy_browser-neko-brave
  used_by:
  - productivity/.tmp_service_deploy_browser-neko-brave
  - productivity/browser-lab
  required: true
  description: Hostname clients use to reach the TURN server
  example: turn.example.internal
- name: BROWSER_LAB_TURN_PASSWORD
  kind: secret-file
  owner: productivity/.tmp_service_deploy_browser-neko-brave
  used_by:
  - productivity/.tmp_service_deploy_browser-neko-brave
  - productivity/browser-lab
  required: true
  description: 'TURN credential (Generate: openssl rand -hex 16)'
  secret_file: browser-lab/turn_password
- name: BROWSER_LAB_TURN_PORT
  kind: literal
  owner: productivity/.tmp_service_deploy_browser-neko-brave
  used_by:
  - productivity/.tmp_service_deploy_browser-neko-brave
  - productivity/browser-lab
  required: false
  default: '3478'
  description: 'TURN listening port (default: 3478)'
  example: '3478'
- name: BROWSER_LAB_TURN_REALM
  kind: literal
  owner: productivity/browser-lab
  used_by:
  - productivity/browser-lab
  required: true
  description: TURN realm (usually your internal domain)
  example: example.internal
- name: BROWSER_LAB_TURN_USER
  kind: literal
  owner: productivity/.tmp_service_deploy_browser-neko-brave
  used_by:
  - productivity/.tmp_service_deploy_browser-neko-brave
  - productivity/browser-lab
  required: false
  default: neko
  description: TURN username for coturn
  example: neko
- name: CIDR_BLOCK
  kind: literal
  owner: security/dns
  used_by:
  - security/dns
  required: false
  default: 192.168.0.0/24
  description: Example subnet - replace with your private subnet
  example: 10.10.0.0/24
- name: CLICKHOUSE_CLUSTER_ENABLED
  kind: literal
  owner: llms/monitoring
  used_by:
  - llms/monitoring
  required: false
  default: 'false'
  description: Enable ClickHouse cluster mode (Keeper-based)
  example: 'false'
- name: CLICKHOUSE_DB
  kind: literal
  owner: main/storage
  used_by:
  - main/storage
  required: false
  default: clickhouse
  description: ClickHouse default database name
  example: default
- name: CLICKHOUSE_PASSWORD
  kind: secret-file
  owner: main/storage
  used_by:
  - llms/monitoring
  - main/storage
  required: true
  description: 'ClickHouse default user password (Generate: openssl rand -hex 32)'
  secret_file: clickhouse/clickhouse_password
- name: CLICKHOUSE_USER
  kind: literal
  owner: main/storage
  used_by:
  - llms/monitoring
  - main/storage
  required: false
  default: clickhouse
  description: ClickHouse default user
  example: default
- name: CLOUDFLARE_N8N_TUNNEL_TOKEN
  kind: secret-file
  owner: security/vendor
  used_by:
  - security/vendor
  required: true
  description: Cloudflare Tunnel token for n8n ingress (from Cloudflare Zero Trust dashboard)
  secret_file: cloudflare/n8n_tunnel_token
- name: CLUSTER_UTILS__POSTGRES_DB
