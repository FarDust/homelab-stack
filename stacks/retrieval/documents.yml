# RAGFlow Document Processing Service
# Document processing and indexing for retrieval-augmented generation

version: "3.9"

networks:
  traefik-public:
    external: true
  traefik:
    external: true

volumes:
  ragflow_logs:
    driver: rclone
    driver_opts:
      remote: "gcs:${GCS_SYNC_STORAGE_BUCKET?err}/ragflow/logs"
      allow_other: "true"
      vfs_cache_mode: full

configs:
  ragflow_config_template:
    file: ./configs/ragflow/service_conf.yaml.template
    name: ragflow_config_template_${CONFIG_VERSION:-0}
  ragflow_nginx_conf:
    file: ./configs/ragflow/nginx_nginx.conf
    name: ragflow_nginx_conf_${CONFIG_VERSION:-0}
  ragflow_nginx_proxy:
    file: ./configs/ragflow/nginx_proxy.conf
    name: ragflow_nginx_proxy_${CONFIG_VERSION:-0}
  ragflow_nginx_confd:
    file: ./configs/ragflow/nginx_conf_d_ragflow.conf
    name: ragflow_nginx_confd_${CONFIG_VERSION:-0}

services:
  ragflow:
    image: infiniflow/ragflow:v0.23.1
    command: ["--enable-adminserver", "--enable-mcpserver"]
    environment:
      - IN_CONTAINER=true
      - DOC_ENGINE=opensearch
      - HF_ENDPOINT=${RAGFLOW_HF_ENDPOINT?err}
      - MAXTOKENNUM=${MAXTOKENNUM:-8192}
      - REDIS_HOST=${RAGFLOW_REDIS_HOST?err}
      - REDIS_PORT=${RAGFLOW_REDIS_PORT?err}
      - REDIS_PASSWORD=${RAGFLOW_REDIS_PASSWORD?err}
      - POSTGRES_HOST=${RAGFLOW_POSTGRES_HOST?err}
      - POSTGRES_PORT=${RAGFLOW_POSTGRES_PORT?err}
      - POSTGRES_USER=${RAGFLOW_POSTGRES_USER?err}
      - POSTGRES_PASSWORD=${RAGFLOW_POSTGRES_PASSWORD?err}
      - POSTGRES_DBNAME=${RAGFLOW_POSTGRES_DBNAME?err}
      - POSTGRES_SSLMODE=${RAGFLOW_POSTGRES_SSLMODE?err}
      - MINIO_HOST=${RAGFLOW_MINIO_HOST?err}
      - MINIO_PORT=${RAGFLOW_MINIO_PORT?err}
      - MINIO_USER=${RAGFLOW_MINIO_USER?err}
      - MINIO_PASSWORD=${RAGFLOW_MINIO_PASSWORD?err}
      - OS_HOST=${RAGFLOW_OS_HOST?err}
      - OS_PORT=${RAGFLOW_OS_PORT?err}
      - OS_USER=${RAGFLOW_OS_USER?err}
      - OPENSEARCH_PASSWORD=${RAGFLOW_OPENSEARCH_PASSWORD?err}
      - DB_TYPE=postgres
      - RAGFLOW_HTTP_APP_KEY=${RAGFLOW_HTTP_APP_KEY?err}
      - RAGFLOW_HTTP_SECRET_KEY=${RAGFLOW_HTTP_SECRET_KEY?err}
      - RAGFLOW_LITELLM_API_KEY=${RAGFLOW_LITELLM_API_KEY?err}
      - LOCAL_DOMAIN=${LOCAL_DOMAIN?err}
      - MCP_HOST=0.0.0.0
      - MCP_PORT=9382
      - MCP_BASE_URL=https://mcp-ragflow.${LOCAL_DOMAIN}
      - MCP_MODE=self-host
      - MCP_API_KEY=${RAGFLOW_MCP_API_KEY?err}
    volumes:
      - ragflow_logs:/ragflow/logs
    networks:
      - traefik-public
      - traefik
    configs:
      - source: ragflow_config_template
        target: /ragflow/conf/service_conf.yaml.template
      - source: ragflow_nginx_conf
        target: /etc/nginx/nginx.conf
      - source: ragflow_nginx_proxy
        target: /etc/nginx/proxy.conf
      - source: ragflow_nginx_confd
        target: /etc/nginx/conf.d/ragflow.conf
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.gpu == true
      labels:
        - traefik.enable=true
        # Admin API router (highest priority)
        - traefik.http.routers.ragflow-admin.entrypoints=websecure
        - traefik.http.routers.ragflow-admin.rule=Host(`ragflow.${LOCAL_DOMAIN}`) && PathPrefix(`/api/v1/admin`)
        - traefik.http.routers.ragflow-admin.tls=true
        - traefik.http.routers.ragflow-admin.tls.certresolver=le-dns
        - traefik.http.routers.ragflow-admin.priority=110
        - traefik.http.routers.ragflow-admin.service=ragflow-admin
        - traefik.http.services.ragflow-admin.loadbalancer.server.port=9381
        # API router for /v1 and /api (higher priority)
        - traefik.http.routers.ragflow-api.entrypoints=websecure
        - traefik.http.routers.ragflow-api.rule=Host(`ragflow.${LOCAL_DOMAIN}`) && (PathPrefix(`/v1`) || PathPrefix(`/api`))
        - traefik.http.routers.ragflow-api.tls=true
        - traefik.http.routers.ragflow-api.tls.certresolver=le-dns
        - traefik.http.routers.ragflow-api.priority=100
        - traefik.http.routers.ragflow-api.service=ragflow-api
        - traefik.http.services.ragflow-api.loadbalancer.server.port=9380
        # MCP router (SSE)
        - traefik.http.middlewares.ragflow-mcp-sse.headers.customResponseHeaders.Cache-Control=no-cache
        - traefik.http.middlewares.ragflow-mcp-sse.headers.customResponseHeaders.Connection=keep-alive
        - traefik.http.middlewares.ragflow-mcp-sse.headers.customResponseHeaders.X-Accel-Buffering=no
        - traefik.http.middlewares.ragflow-mcp-sse.headers.customResponseHeaders.Pragma=no-cache
        - traefik.http.routers.ragflow-mcp.entrypoints=websecure
        - traefik.http.routers.ragflow-mcp.rule=Host(`mcp-ragflow.${LOCAL_DOMAIN}`)
        - traefik.http.routers.ragflow-mcp.tls=true
        - traefik.http.routers.ragflow-mcp.tls.certresolver=le-dns
        - traefik.http.routers.ragflow-mcp.priority=120
        - traefik.http.routers.ragflow-mcp.middlewares=ragflow-mcp-sse
        - traefik.http.routers.ragflow-mcp.service=ragflow-mcp
        - traefik.http.services.ragflow-mcp.loadbalancer.server.port=9382
        - traefik.http.services.ragflow-mcp.loadbalancer.passHostHeader=true
        - traefik.http.services.ragflow-mcp.loadbalancer.responseForwarding.flushInterval=100ms
        # HTTPS router (main UI, lower priority)
        - traefik.http.routers.ragflow.entrypoints=websecure
        - traefik.http.routers.ragflow.rule=Host(`ragflow.${LOCAL_DOMAIN}`)
        - traefik.http.routers.ragflow.tls=true
        - traefik.http.routers.ragflow.tls.certresolver=le-dns
        - traefik.http.routers.ragflow.priority=50
        - traefik.http.routers.ragflow.service=ragflow
        - traefik.http.services.ragflow.loadbalancer.server.port=80
