pid /tmp/nginx.pid;
worker_processes 1;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  # BEGIN media-map (generated by `japan-assets nginx-map`; edit assets/manifest.json instead)
  map $uri $blob_key {
    default "";
    "/media/074ae49dc2e7410b.jpg" "maps/gsi-tokyo-aerial.jpg";
    "/media/188b97ee4905366c.jpg" "hakone-report-images/commons-lake-ashi-guilhem-vellut.jpg";
    "/media/1da452e44c6d2793.jpg" "hakone-report-images/COFFEE-CAMP.jpg";
    "/media/1e67ae8b3b0f92c6.jpg" "hakone-report-images/Miyanoshita.jpg";
    "/media/2a9d60f33e37cc1c.jpg" "hakone-report-images/Hakone-Yumoto.jpg";
    "/media/3f3b489aa22b1200.jpg" "hakone-report-images/Gora.jpg";
    "/media/480fc23b4e128346.jpg" "journey/gion.jpg";
    "/media/4938cb1cc9c264c8.jpg" "hakone-report-images/Hakone.jpg";
    "/media/6513c02ab3d493f1.jpg" "journey/inari.jpg";
    "/media/79e56a2331deaee3.jpg" "hakone-report-images/Hakone-Ropeway-wakudani-Station.jpg";
    "/media/8951f1805c0a8ff2.jpg" "hakone-report-images/Maimon-Sushi-Kanazawa-Hakone-Gora.jpg";
    "/media/8dc2e6f4d0dc5880.jpg" "hakone-report-images/GORA-BREWERY-and-GRILL.jpg";
    "/media/94ab3d60d3feb177.jpg" "maps/gsi-osaka-aerial.jpg";
    "/media/95873362883069a4.jpg" "hakone-report-images/commons-gora-park-kikucha.jpg";
    "/media/9abf4b3218bc8c67.jpg" "hakone-report-images/commons-owakudani-ropeway-joli-rumi.jpg";
    "/media/9ed44c35d1853874.jpg" "maps/kyoto-sentinel2-2025.jpg";
    "/media/a549b4a4823210c8.jpg" "hakone-report-images/Hakone-Gora-Park.jpg";
    "/media/a7044fd568dd1377.jpg" "hakone-report-images/commons-open-air-museum-suicasmo.jpg";
    "/media/aa8ec792dbc7c26d.jpg" "maps/gsi-hakone-aerial.jpg";
    "/media/ad3930f95e5d103a.jpg" "hakone-report-images/Hakone-Open-Air-Museum.jpg";
    "/media/bc511c53454793bb.jpg" "hakone-report-images/Saien-Breakfast-by-Buddhist-Monks.jpg";
    "/media/be9f4c2de8c33986.jpg" "hakone-report-images/commons-hakone-tozan-naka-gora-lerk.jpg";
    "/media/c6186465450aec58.jpg" "hakone-report-images/Owakudani.jpg";
    "/media/c79dec29a21f2abc.jpg" "maps/gsi-kyoto-aerial.jpg";
    "/media/d7a5b52ad6cbf79a.jpg" "maps/central-japan-sentinel2-2025.jpg";
    "/media/e7117c86b6a5469d.jpg" "maps/hakone-sentinel2-2025.jpg";
    "/media/e8f0f165343b6449.jpg" "hakone-report-images/Sounzan.jpg";
    "/media/e98c7c01c9f07c1b.jpg" "hakone-report-images/Hakone-Museum-of-Art.jpg";
    "/media/fed94d4eced9984e.jpg" "hakone-report-images/Kowakudani.jpg";
  }
  # END media-map
  # Object name of the original request for the member check (auth_request subrequests see their own $uri, not the media path).
  map $request_uri $media_object {
    default "";
    "~^/media/(?<object>[0-9a-f]{16}\.[a-z0-9]{2,5})(\?.*)?$" $object;
  }
  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # add_header in a location replaces the server-level ones, so Permissions-Policy (geolocation: this origin only, see docs/adr/offline_queue_geolocation_adr.md) is repeated in each location.
    add_header X-Content-Type-Options nosniff always;
    add_header Permissions-Policy 'geolocation=(self)' always;
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml;
    location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
    location = /sw.js {
      add_header Cache-Control 'no-store' always;
      add_header Service-Worker-Allowed '/' always;
      add_header X-Content-Type-Options nosniff always;
      add_header Permissions-Policy 'geolocation=(self)' always;
      try_files $uri =404;
    }
    # Heavy resources (docs/adr/blob_storage_assets_adr.md): read-only proxy to the cluster's RustFS bucket over the Swarm network. The origin stays
    # tailnet-only; the bucket has no route of its own. Streaming (no buffering) keeps the 32 MB container and its small tmpfs out of the picture.
    location ^~ /media/ {
      limit_except GET HEAD { deny all; }
      resolver 127.0.0.11 valid=10s ipv6=off;
      set $blob_store main-rustfs_rustfs;
      # Only content-addressed names of the generated map are served (the bucket keys stay unreachable and unguessable).
      if ($blob_key = "") { return 404; }
      # Members only (docs/adr/blob_storage_assets_adr.md, addendum 2): the bearer token must belong to a member of a trip whose api.assets lists this object.
      auth_request /_media_member;
      proxy_pass http://$blob_store:9000/japan-trip-assets/$blob_key;
      proxy_http_version 1.1;
      proxy_set_header Host $blob_store:9000;
      # RustFS reads any Authorization header as an S3 signature and answers 400: the member token is only for the auth_request above.
      proxy_set_header Authorization "";
      proxy_set_header Cookie "";
      proxy_set_header Connection '';
      proxy_buffering off;
      proxy_connect_timeout 5s;
      proxy_read_timeout 120s;
      proxy_hide_header Set-Cookie;
      proxy_hide_header Cache-Control;
      proxy_hide_header x-amz-request-id;
      proxy_hide_header x-amz-id-2;
      gzip off;
      add_header Cache-Control 'private, max-age=31536000, immutable' always;
      add_header X-Content-Type-Options nosniff always;
      add_header Permissions-Policy 'geolocation=(self)' always;
    }
    # PostgREST validates the OIDC token (401 without one) and row level security keeps non-members' rows out; the singular-object Accept turns
    # "no row" into 406, which becomes 403 here. Any other answer (API down: 5xx) makes auth_request fail closed with 500.
    location = /_media_member {
      internal;
      resolver 127.0.0.11 valid=10s ipv6=off;
      set $trip_api apps-japan-trip-api_api;
      proxy_pass http://$trip_api:3000/assets?object=eq.$media_object&select=object&limit=1;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Accept application/vnd.pgrst.object+json;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Range "";
      proxy_set_header Cookie "";
      proxy_connect_timeout 5s;
      proxy_read_timeout 10s;
      proxy_intercept_errors on;
      error_page 406 = @media_not_member;
    }
    location @media_not_member { return 403; }
    location = /reset {
      default_type text/html;
      add_header Cache-Control 'no-store' always;
      add_header X-Content-Type-Options nosniff always;
      add_header Permissions-Policy 'geolocation=(self)' always;
      try_files /reset.html =404;
    }
    location = /offline-pack.json {
      add_header Cache-Control 'no-store' always;
      add_header X-Content-Type-Options nosniff always;
      add_header Permissions-Policy 'geolocation=(self)' always;
      try_files $uri =404;
    }
    location = /manifest.webmanifest {
      default_type application/manifest+json;
      add_header Cache-Control 'no-cache' always;
      add_header X-Content-Type-Options nosniff always;
      add_header Permissions-Policy 'geolocation=(self)' always;
      try_files $uri =404;
    }
    location ~ "^/assets/.+-[A-Za-z0-9_-]{8}\.(js|css|woff2|jpg|jpeg|png|webp|svg)$" {
      add_header Cache-Control 'private, max-age=31536000, immutable';
      add_header X-Content-Type-Options nosniff always;
      add_header Permissions-Policy 'geolocation=(self)' always;
      try_files $uri =404;
    }
    location ~ \.(js|css|json|jpg|jpeg|png|webp|svg)$ {
      add_header Cache-Control 'no-cache' always;
      add_header X-Content-Type-Options nosniff always;
      add_header Permissions-Policy 'geolocation=(self)' always;
      try_files $uri =404;
    }
    location / {
      add_header Cache-Control 'no-cache' always;
      add_header X-Content-Type-Options nosniff always;
      add_header Permissions-Policy 'geolocation=(self)' always;
      try_files $uri $uri/ /index.html;
    }
  }
}
