pid /tmp/nginx.pid;
worker_processes 1;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
    location = /sw.js {
      add_header Cache-Control 'no-store' always;
      add_header Service-Worker-Allowed '/' always;
      add_header X-Content-Type-Options nosniff always;
      try_files $uri =404;
    }
    location = /offline-pack.json {
      add_header Cache-Control 'no-store' always;
      add_header X-Content-Type-Options nosniff always;
      try_files $uri =404;
    }
    location = /manifest.webmanifest {
      default_type application/manifest+json;
      add_header Cache-Control 'no-cache' always;
      add_header X-Content-Type-Options nosniff always;
      try_files $uri =404;
    }
    location ~ "^/assets/.+-[A-Za-z0-9_-]{8}\.(js|css|jpg|jpeg|png|webp|svg)$" {
      add_header Cache-Control 'private, max-age=31536000, immutable';
      add_header X-Content-Type-Options nosniff always;
      try_files $uri =404;
    }
    location ~ \.(js|css|json|jpg|jpeg|png|webp|svg)$ {
      add_header Cache-Control 'no-cache' always;
      add_header X-Content-Type-Options nosniff always;
      try_files $uri =404;
    }
    location / {
      add_header Cache-Control 'no-cache' always;
      add_header X-Content-Type-Options nosniff always;
      try_files $uri $uri/ /index.html;
    }
  }
}
