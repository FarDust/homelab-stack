version: '3.9'

x-common:
  database:
    &db-environment
    MYSQL_USER: &db-user "firefly"
    MYSQL_PASSWORD: &db-password "${MYSQL_PASSWORD}"
    MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"

services:
  fireflyiii:
    image: fireflyiii/core:latest
    volumes:
      - firefly_iii_upload:/var/www/html/storage/upload
    networks:
      - financial-private
      - traefik-public
    secrets:
      - source: fireflyiii_app_key
    environment:
      SITE_OWNER: ${MAINTAINER_EMAIL}
      TZ: America/Santiago
      TRUSTED_PROXIES: '**'
      DB_CONNECTION: mysql
      DB_HOST: fireflyiii-db
      DB_DATABASE: firefly
      DB_PASSWORD: *db-password
      DB_USERNAME: *db-user
      ALLOW_WEBHOOKS: 'true'
      APP_URL: https://fireflyiii.${LOCAL_DOMAIN}
      APP_KEY_FILE: /run/secrets/fireflyiii_app_key
    depends_on:
      - fireflyiii-db
    deploy:
      placement:
          constraints:
            - node.role == manager
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=true
        - traefik.http.routers.fireflyiii-http.entrypoints=web
        - traefik.http.routers.fireflyiii-http.rule=Host(`fireflyiii.${LOCAL_DOMAIN}`)
        - traefik.http.routers.fireflyiii.entrypoints=websecure
        - traefik.http.routers.fireflyiii.rule=Host(`fireflyiii.${LOCAL_DOMAIN}`)
        - traefik.http.routers.fireflyiii-http.middlewares=fireflyiii-https@swarm
        - traefik.http.middlewares.fireflyiii-https.redirectscheme.scheme=https
        - traefik.http.routers.fireflyiii.tls=true
        - traefik.http.routers.fireflyiii.tls.certresolver=le-dns
        - traefik.http.services.fireflyiii.loadbalancer.server.port=8080
        - "traefik.swarm.network=traefik-public"
  fireflyiii-db:
    image: mariadb
    command: --default-authentication-plugin=mysql_native_password
    environment:
      <<: *db-environment
      MYSQL_DATABASE: "firefly"
    networks:
      - financial-private
    deploy:
      placement:
          constraints:
            - node.role == manager
      restart_policy:
        condition: on-failure
    volumes:
      - firefly_iii_db:/var/lib/mysql
volumes:
   firefly_iii_upload:
   firefly_iii_db:

networks:
  traefik-public:
    external: true
  financial-private:
    driver: overlay
secrets:
  fireflyiii_app_key:
    file: ../../secrets/fireflyiii/app_key
