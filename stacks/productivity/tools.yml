version: "3.9"

networks:
  traefik-public:
    external: true
  productivity-internal:
    driver: overlay
    attachable: true

services:
  stirling-pdf:
    image: stirlingtools/stirling-pdf:latest-fat
    networks:
      - traefik-public
    environment:
      - DOCKER_ENABLE_SECURITY=false
      - LANGS=en_GB
      - TZ=${USER_TIMEZONE:-UTC}
    configs:
      - source: stirlingpdf_custom_settings
        target: /configs/custom_settings.yml
    volumes:
      - stirlingpdf_tessdata:/usr/share/tessdata
      - stirlingpdf_customfiles:/customFiles
      - stirlingpdf_logs:/logs
      - stirlingpdf_pipeline:/pipeline
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
      placement:
        constraints:
        - node.role == manager
        - node.labels.swarm.leader == true
      restart_policy:
        condition: on-failure
      labels:
        - "sablier.enable=true"
        - "sablier.group=productivity"
        - "traefik.enable=true"
        - "traefik.http.routers.stirlingpdf.rule=Host(`pdf.${LOCAL_DOMAIN}`)"
        - "traefik.http.routers.stirlingpdf.entrypoints=websecure"
        - "traefik.http.routers.stirlingpdf.tls=true"
        - "traefik.http.routers.stirlingpdf.tls.certresolver=le-dns"
        - "traefik.http.services.stirlingpdf.loadbalancer.server.port=8080"
        - "traefik.http.routers.stirlingpdf.middlewares=stirlingpdf-oauth2-errors@swarm,stirlingpdf-oauth2-forward-auth@swarm,load-productivity@file"
        # Keycloak via shared oauth2-proxy forwardAuth; as decided in docs/adr/authelia_to_keycloak_forwardauth_adr.md
        - "traefik.http.middlewares.stirlingpdf-oauth2-errors.errors.status=401"
        - "traefik.http.middlewares.stirlingpdf-oauth2-errors.errors.service=oauth2-proxy"
        - "traefik.http.middlewares.stirlingpdf-oauth2-errors.errors.query=/oauth2/sign_in?rd={url}"
        - "traefik.http.middlewares.stirlingpdf-oauth2-errors.errors.statusRewrites.401=302"
        - "traefik.http.middlewares.stirlingpdf-oauth2-forward-auth.forwardAuth.address=http://main-identity-gateway_oauth2-proxy:4180/oauth2/auth"
        - "traefik.http.middlewares.stirlingpdf-oauth2-forward-auth.forwardAuth.authRequestHeaders=Authorization,Cookie,X-Forwarded-Host,X-Forwarded-Proto,X-Forwarded-Uri,X-Forwarded-Method"
        - "traefik.http.middlewares.stirlingpdf-oauth2-forward-auth.forwardAuth.trustForwardHeader=true"
        - "traefik.http.middlewares.stirlingpdf-oauth2-forward-auth.forwardAuth.authResponseHeaders=X-Auth-Request-User,X-Auth-Request-Email"
        - "traefik.http.routers.stirlingpdf-http.rule=Host(`pdf.${LOCAL_DOMAIN}`)"
        - "traefik.http.routers.stirlingpdf-http.entrypoints=web"
        - "traefik.http.routers.stirlingpdf-http.middlewares=stirlingpdf-https@swarm"
        - "traefik.http.middlewares.stirlingpdf-https.redirectscheme.scheme=https"
        - "traefik.swarm.network=traefik-public"
        - "traefik.swarm.lbswarm=true"

  searxng:
    image: searxng/searxng:latest
    networks:
      - traefik-public
    environment:
      - SEARXNG_BASE_URL=https://search.${LOCAL_DOMAIN?err}/
      - SEARXNG_LIMITER=false
      - SEARXNG_IMAGE_PROXY=true
      - SEARXNG_PORT=8080
      - SEARXNG_BIND_ADDRESS=0.0.0.0
      - TZ=${USER_TIMEZONE:-UTC}
    secrets:
      - searxng_secret
    entrypoint: >
      sh -c '
        export SEARXNG_SECRET=$$(cat /run/secrets/searxng_secret)
        exec /usr/local/searxng/entrypoint.sh
      '
    configs:
      - source: searxng_limiter
        target: /etc/searxng/limiter.toml
      - source: searxng_settings
        target: /etc/searxng/settings.yml
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
      labels:
        - "sablier.enable=true"
        - "sablier.group=searxng"
        - "traefik.enable=true"
        # API router without auth for /search endpoint (higher priority), but still wakes SearXNG.
        - "traefik.http.routers.searxng-api.rule=Host(`search.${LOCAL_DOMAIN}`) && PathPrefix(`/search`)"
        - "traefik.http.routers.searxng-api.entrypoints=websecure"
        - "traefik.http.routers.searxng-api.tls=true"
        - "traefik.http.routers.searxng-api.tls.certresolver=le-dns"
        - "traefik.http.routers.searxng-api.middlewares=load-searxng@file"
        - "traefik.http.routers.searxng-api.priority=100"
        - "traefik.http.routers.searxng-api.service=searxng-api"
        # Main router with auth for web interface
        - "traefik.http.routers.searxng-web.rule=Host(`search.${LOCAL_DOMAIN}`)"
        - "traefik.http.routers.searxng-web.entrypoints=websecure"
        - "traefik.http.routers.searxng-web.tls=true"
        - "traefik.http.routers.searxng-web.tls.certresolver=le-dns"
        - "traefik.http.routers.searxng-web.middlewares=searxng-web-oauth2-errors@swarm,searxng-web-oauth2-forward-auth@swarm,load-searxng@file"
        # Keycloak via shared oauth2-proxy forwardAuth; as decided in docs/adr/authelia_to_keycloak_forwardauth_adr.md
        - "traefik.http.middlewares.searxng-web-oauth2-errors.errors.status=401"
        - "traefik.http.middlewares.searxng-web-oauth2-errors.errors.service=oauth2-proxy"
        - "traefik.http.middlewares.searxng-web-oauth2-errors.errors.query=/oauth2/sign_in?rd={url}"
        - "traefik.http.middlewares.searxng-web-oauth2-errors.errors.statusRewrites.401=302"
        - "traefik.http.middlewares.searxng-web-oauth2-forward-auth.forwardAuth.address=http://main-identity-gateway_oauth2-proxy:4180/oauth2/auth"
        - "traefik.http.middlewares.searxng-web-oauth2-forward-auth.forwardAuth.authRequestHeaders=Authorization,Cookie,X-Forwarded-Host,X-Forwarded-Proto,X-Forwarded-Uri,X-Forwarded-Method"
        - "traefik.http.middlewares.searxng-web-oauth2-forward-auth.forwardAuth.trustForwardHeader=true"
        - "traefik.http.middlewares.searxng-web-oauth2-forward-auth.forwardAuth.authResponseHeaders=X-Auth-Request-User,X-Auth-Request-Email"
        - "traefik.http.routers.searxng-web.priority=50"
        - "traefik.http.routers.searxng-web.service=searxng-web"
        # Load balancer services
        - "traefik.http.services.searxng-api.loadbalancer.server.port=8080"
        - "traefik.http.services.searxng-web.loadbalancer.server.port=8080"
        # HTTP redirect
        - "traefik.http.routers.searxng-http.rule=Host(`search.${LOCAL_DOMAIN}`)"
        - "traefik.http.routers.searxng-http.entrypoints=web"
        - "traefik.http.routers.searxng-http.middlewares=searxng-https@swarm"
        - "traefik.http.routers.searxng-http.service=searxng-web"
        - "traefik.http.middlewares.searxng-https.redirectscheme.scheme=https"
        - "traefik.swarm.network=traefik-public"
        - "traefik.swarm.lbswarm=true"

volumes:
  stirlingpdf_tessdata:
  stirlingpdf_customfiles:
  stirlingpdf_logs:
  stirlingpdf_pipeline:

secrets:
  searxng_secret:
    file: ./secrets/searxng_secret

configs:
  stirlingpdf_custom_settings:
    name: stirlingpdf_custom_settings-${CONFIG_VERSION:-0}
    file: ./configs/stirlingpdf/custom_settings.yml
  searxng_limiter:
    name: searxng_limiter-${CONFIG_VERSION:-0}
    file: ./configs/searxng/limiter.toml
  searxng_settings:
    name: searxng_settings-${CONFIG_VERSION:-0}
    file: ./configs/searxng/settings.yml
