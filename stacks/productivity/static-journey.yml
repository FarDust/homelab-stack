version: '3.9'
services:
  web:
    image: ${JOURNEY_IMAGE?err}
    user: '101:101'
    entrypoint: [nginx]
    command: ['-g', 'daemon off;']
    read_only: true
    cap_drop: [ALL]
    networks: [traefik-public, traefik]
    volumes:
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 16777216
    configs:
      - source: nginx
        target: /etc/nginx/nginx.conf
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/healthz']
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.load.tier == light
          - node.labels.node.ephemeral != true
      resources:
        reservations:
          memory: 8M
        limits:
          memory: 32M
          cpus: '0.25'
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        order: stop-first
        failure_action: rollback
      labels:
        - traefik.enable=true
        - traefik.swarm.network=traefik-public
        - traefik.swarm.lbswarm=true
        - traefik.http.routers.static-journey.rule=Host(`${JOURNEY_HOSTNAME?err}`)
        - traefik.http.routers.static-journey.entrypoints=websecure
        - traefik.http.routers.static-journey.tls=true
        - traefik.http.routers.static-journey.tls.certresolver=le-dns
        - traefik.http.services.static-journey.loadbalancer.server.port=8080
networks:
  traefik-public:
    external: true
  traefik:
    external: true
configs:
  nginx:
    name: static_journey_nginx-${JOURNEY_VERSION?err}-${CONFIG_VERSION:-0}
    file: ./configs/static-journey/nginx.conf
