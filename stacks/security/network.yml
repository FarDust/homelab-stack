version: '3.8'

services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    hostname: clickhouse
    environment:
      - CLICKHOUSE_USER=ntopng
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD?err} # TODO: Change to CLICKHOUSE_PASSWORD_FILE
      - CLICKHOUSE_DB=ntopng
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    networks:
      - traefik-public
      - security-internal
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        # HTTP interface via Traefik
        - "traefik.http.routers.clickhouse.rule=Host(`clickhouse.${LOCAL_DOMAIN?err}`)"
        - "traefik.http.routers.clickhouse.entrypoints=websecure"
        - "traefik.http.routers.clickhouse.tls=true"
        - "traefik.http.routers.clickhouse.tls.certresolver=le-dns"
        - "traefik.http.routers.clickhouse.middlewares=authelia@swarm"
        - "traefik.http.services.clickhouse.loadbalancer.server.port=8123"
        # TCP native protocol via Traefik
        - "traefik.tcp.routers.clickhouse-native.rule=HostSNI(`service.clickhouse.${LOCAL_DOMAIN?err}`)"
        - "traefik.tcp.routers.clickhouse-native.entrypoints=host-internal"
        - "traefik.tcp.routers.clickhouse-native.tls=true"
        - "traefik.tcp.routers.clickhouse-native.tls.certresolver=le-dns"
        - "traefik.tcp.services.clickhouse-native.loadbalancer.server.port=9000"
        - "traefik.swarm.network=traefik-public"

  security-redis:
    image: bitnami/redis:latest
    secrets:
      - redis_password
    volumes:
      - redis-data:/data
    networks:
      - traefik-public
      - security-internal
    environment:
      - REDIS_PASSWORD_FILE=/run/secrets/redis_password
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        # TCP routing for Redis
        - "traefik.tcp.routers.security-redis.rule=HostSNI(`security-redis.${LOCAL_DOMAIN?err}`)"
        - "traefik.tcp.routers.security-redis.entrypoints=host-internal"
        - "traefik.tcp.routers.security-redis.tls=true"
        - "traefik.tcp.routers.security-redis.tls.certresolver=le-dns"
        - "traefik.tcp.services.security-redis.loadbalancer.server.port=6379"
        - "traefik.swarm.network=traefik-public"

  ntopng-proxy:
    image: traefik/whoami
    networks:
      - traefik-public
    deploy:
      mode: global
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.ntopng.rule=Host(`ntopng.${LOCAL_DOMAIN?err}`)"
        - "traefik.http.routers.ntopng.entrypoints=websecure"
        - "traefik.http.routers.ntopng.tls=true"
        - "traefik.http.routers.ntopng.tls.certresolver=le-dns"
        - "traefik.http.routers.ntopng.middlewares=authelia@swarm"
        - "traefik.http.services.ntopng.loadbalancer.server.url=http://${HOST_IP:?err}:3005"
        - "traefik.swarm.network=traefik-public"

secrets:
  redis_password:
    file: ../../secrets/redis/redis_password

volumes:
  clickhouse-data:
    driver: local
  clickhouse-logs:
    driver: local
  redis-data:
    driver: local

networks:
  security-internal:
    driver: overlay
    attachable: false
  traefik-public:
    external: true
