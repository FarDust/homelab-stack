version: "3.8"
services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    environment:
      - WEBUI_PORT=${WEBUI_PORT:-8080}
      - TORRENTING_PORT=${TORRENTING_PORT:-6881}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${USER_TIMEZONE:-Etc/UTC}
      - DOCKER_MODS=ghcr.io/vuetorrent/vuetorrent-lsio-mod:latest
    volumes:
      - qbittorrent_config:/config
      - downloads_nfs:/downloads
    networks:
      - traefik-public
      - media-net
    deploy:
      mode: replicated
      replicas: 1
      labels:
        - traefik.enable=true
        - traefik.http.routers.qbittorrent.rule=Host(`qbittorrent.${LOCAL_DOMAIN}`)
        - traefik.http.routers.qbittorrent.entrypoints=websecure
        - traefik.http.routers.qbittorrent.tls=true
        - traefik.http.routers.qbittorrent.tls.certresolver=le-dns
        - traefik.http.services.qbittorrent.loadbalancer.server.port=${WEBUI_PORT:-8080}
        - traefik.swarm.network=traefik-public
      placement:
        constraints:
          - node.labels.site.class != cloud
          - node.labels.gpu == true
          - node.labels.load.tier == heavy
          - node.labels.node.ephemeral == true

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    environment:
      - LOG_LEVEL=${FLARESOLVERR_LOG_LEVEL:-info}
      - LOG_HTML=${FLARESOLVERR_LOG_HTML:-false}
      - CAPTCHA_SOLVER=${FLARESOLVERR_CAPTCHA_SOLVER:-none}
      - TZ=${USER_TIMEZONE:-Etc/UTC}
    networks:
      - indexer-net
    deploy:
      mode: replicated
      replicas: 1
      labels:
        - traefik.enable=false
      placement:
        constraints:
          - node.labels.site.class != cloud

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${USER_TIMEZONE:-Etc/UTC}
      - FLARESOLVERR_URL=${FLARESOLVERR_URL:-http://flaresolverr:8191}
    volumes:
      - prowlarr_config:/config
    networks:
      - indexer-net
      - traefik-public
    deploy:
      mode: replicated
      replicas: 1
      labels:
        - traefik.enable=true
        - traefik.http.routers.prowlarr.rule=Host(`prowlarr.${LOCAL_DOMAIN}`)
        - traefik.http.routers.prowlarr.entrypoints=websecure
        - traefik.http.routers.prowlarr.tls=true
        - traefik.http.routers.prowlarr.tls.certresolver=le-dns
        - traefik.http.services.prowlarr.loadbalancer.server.port=9696
        - traefik.swarm.network=traefik-public
      placement:
        constraints:
          - node.labels.site.class != cloud
          - node.role == manager
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${USER_TIMEZONE:-Etc/UTC}
    volumes:
      - sonarr_config:/config
      - tv_nfs:/tv
      - downloads_nfs:/downloads
    networks:
      - indexer-net
      - traefik-public
      - media-net
    deploy:
      mode: replicated
      replicas: 1
      labels:
        - traefik.enable=true
        - traefik.http.routers.sonarr.rule=Host(`sonarr.${LOCAL_DOMAIN}`)
        - traefik.http.routers.sonarr.entrypoints=websecure
        - traefik.http.routers.sonarr.tls=true
        - traefik.http.routers.sonarr.tls.certresolver=le-dns
        - traefik.http.services.sonarr.loadbalancer.server.port=8989
        - traefik.swarm.network=traefik-public
      placement:
        constraints:
          - node.labels.gpu == true
          - node.labels.load.tier == heavy
          - node.labels.node.ephemeral == true

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${USER_TIMEZONE:-Etc/UTC}
    volumes:
      - radarr_config:/config
      - movies_nfs:/movies
      - downloads_nfs:/downloads
    networks:
      - indexer-net
      - traefik-public
      - media-net
    deploy:
      mode: replicated
      replicas: 1
      labels:
        - traefik.enable=true
        - traefik.http.routers.radarr.rule=Host(`radarr.${LOCAL_DOMAIN}`)
        - traefik.http.routers.radarr.entrypoints=websecure
        - traefik.http.routers.radarr.tls=true
        - traefik.http.routers.radarr.tls.certresolver=le-dns
        - traefik.http.services.radarr.loadbalancer.server.port=7878
        - traefik.swarm.network=traefik-public
      placement:
        constraints:
          - node.labels.gpu == true
          - node.labels.load.tier == heavy
          - node.labels.node.ephemeral == true

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${USER_TIMEZONE:-Etc/UTC}
    volumes:
      - bazarr_config:/config
      - tv_nfs:/tv
      - movies_nfs:/movies
    networks:
      - indexer-net
      - traefik-public
      - media-net
    deploy:
      mode: replicated
      replicas: 1
      labels:
        - traefik.enable=true
        - traefik.http.routers.bazarr.rule=Host(`bazarr.${LOCAL_DOMAIN}`)
        - traefik.http.routers.bazarr.entrypoints=websecure
        - traefik.http.routers.bazarr.tls=true
        - traefik.http.routers.bazarr.tls.certresolver=le-dns
        - traefik.http.services.bazarr.loadbalancer.server.port=6767
        - traefik.swarm.network=traefik-public
      placement:
        constraints:
          - node.labels.gpu == true
          - node.labels.load.tier == heavy
          - node.labels.node.ephemeral == true

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${USER_TIMEZONE:-Etc/UTC}
      - JELLYFIN_PublishedServerUrl=${JELLYFIN_PublishedServerUrl:-https://jellyfin.${LOCAL_DOMAIN}}
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - jellyfin_config:/config
      - media_nfs:/data
      - tv_nfs:/data/tvshows
      - movies_nfs:/data/movies
      - downloads_nfs:/data/media_downloads
    networks:
      - traefik-public
      - media-net
    deploy:
      mode: replicated
      replicas: 1
      labels:
        - traefik.enable=true
        - traefik.http.routers.jellyfin.rule=Host(`jellyfin.${LOCAL_DOMAIN}`)
        - traefik.http.routers.jellyfin.entrypoints=websecure
        - traefik.http.routers.jellyfin.tls=true
        - traefik.http.routers.jellyfin.tls.certresolver=le-dns
        - traefik.http.services.jellyfin.loadbalancer.server.port=8096
        - traefik.swarm.network=traefik-public
      placement:
        constraints:
          - node.labels.gpu == true
          - node.labels.load.tier == heavy
          - node.labels.node.ephemeral == true

  jellyseerr:
    image: ghcr.io/fallenbagel/jellyseerr:latest
    environment:
      - LOG_LEVEL=${JELLYSEERR_LOG_LEVEL:-info}
      - TZ=${USER_TIMEZONE:-Etc/UTC}
      - PORT=${JELLYSEERR_PORT:-5055}
    volumes:
      - jellyseerr_config:/app/config
    networks:
      - traefik-public
      - media-net
    deploy:
      mode: replicated
      replicas: 1
      labels:
        - traefik.enable=true
        - traefik.http.routers.jellyseerr.rule=Host(`jellyseerr.${LOCAL_DOMAIN}`)
        - traefik.http.routers.jellyseerr.entrypoints=websecure
        - traefik.http.routers.jellyseerr.tls=true
        - traefik.http.routers.jellyseerr.tls.certresolver=le-dns
        - traefik.http.services.jellyseerr.loadbalancer.server.port=${JELLYSEERR_PORT:-5055}
        - traefik.swarm.network=traefik-public
      placement:
        constraints:
          - node.labels.gpu == true
          - node.labels.load.tier == heavy
          - node.labels.node.ephemeral == true

volumes:
  qbittorrent_config:
  prowlarr_config:
  sonarr_config:
  radarr_config:
  bazarr_config:
  jellyfin_config:
  jellyseerr_config:
  downloads_nfs:
    driver: local
    driver_opts:
      type: nfs4
      o: addr=${NFS_MEDIA_HOST?err},rw,nfsvers=4.2,proto=tcp,hard,timeo=600,retrans=2
      device: ":/srv/media/downloads"
  tv_nfs:
    driver: local
    driver_opts:
      type: nfs4
      o: addr=${NFS_MEDIA_HOST?err},rw,nfsvers=4.2,proto=tcp,hard,timeo=600,retrans=2
      device: ":/srv/media/tv"
  movies_nfs:
    driver: local
    driver_opts:
      type: nfs4
      o: addr=${NFS_MEDIA_HOST?err},rw,nfsvers=4.2,proto=tcp,hard,timeo=600,retrans=2
      device: ":/srv/media/movies"
  media_nfs:
    driver: local
    driver_opts:
      type: nfs4
      o: addr=${NFS_MEDIA_HOST?err},rw,nfsvers=4.2,proto=tcp,hard,timeo=600,retrans=2
      device: ":/srv/media"

networks:
  traefik-public:
    external: true
  indexer-net:
    driver: overlay
  media-net:
    driver: overlay
