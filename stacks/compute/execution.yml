version: '3.8'

services:
  sandbox-executor-manager:
    image: ${SANDBOX_EXECUTOR_MANAGER_IMAGE:-infiniflow/sandbox-executor-manager:latest}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - traefik-public
    environment:
      - TZ=${TIMEZONE:-UTC}
      - SANDBOX_EXECUTOR_MANAGER_POOL_SIZE=${SANDBOX_EXECUTOR_MANAGER_POOL_SIZE:-3}
      - SANDBOX_BASE_PYTHON_IMAGE=${SANDBOX_BASE_PYTHON_IMAGE:-infiniflow/sandbox-base-python:latest}
      - SANDBOX_BASE_NODEJS_IMAGE=${SANDBOX_BASE_NODEJS_IMAGE:-infiniflow/sandbox-base-nodejs:latest}
      - SANDBOX_ENABLE_SECCOMP=${SANDBOX_ENABLE_SECCOMP:-false}
      - SANDBOX_MAX_MEMORY=${SANDBOX_MAX_MEMORY:-256m}
      - SANDBOX_TIMEOUT=${SANDBOX_TIMEOUT:-10s}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sandbox-executor.rule=Host(`execution.${LOCAL_DOMAIN}`)"
      - "traefik.http.routers.sandbox-executor.entrypoints=websecure"
      - "traefik.http.routers.sandbox-executor.tls=true"
      - "traefik.http.routers.sandbox-executor.tls.certresolver=le-dns"
      - "traefik.http.services.sandbox-executor.loadbalancer.server.port=9385"
      - "traefik.swarm.network=traefik-public"
    healthcheck:
      test: ["CMD", "curl", "http://localhost:9385/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
          - node.labels.swarm.leader == true
      restart_policy:
        condition: on-failure
        delay: ${RESTART_DELAY_STANDARD}
        max_attempts: ${RESTART_MAX_ATTEMPTS}
        window: ${RESTART_WINDOW_STANDARD}
      update_config:
        order: stop-first
        failure_action: rollback
        monitor: ${UPDATE_MONITOR_STANDARD}
        max_failure_ratio: 0.3
      rollback_config:
        order: stop-first
        monitor: ${ROLLBACK_MONITOR_STANDARD}
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  playwright:
    image: ghcr.io/firecrawl/playwright-service:latest
    environment:
      - PORT=3000
      - PROXY_SERVER=${PROXY_SERVER}
      - PROXY_USERNAME=${PROXY_USERNAME}
      - PROXY_PASSWORD=${PROXY_PASSWORD}
      - BLOCK_MEDIA=${BLOCK_MEDIA}
      - MAX_CONCURRENT_PAGES=${CRAWL_CONCURRENT_REQUESTS:-10}
    networks:
      - traefik-public
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.playwright-service.entrypoints=websecure"
      - "traefik.http.routers.playwright-service.rule=Host(`playwright.${LOCAL_DOMAIN?err}`)"
      - "traefik.http.routers.playwright-service.tls=true"
      - "traefik.http.routers.playwright-service.tls.certresolver=le-dns"
      - "traefik.http.services.playwright-service.loadbalancer.server.port=3000"
      - "traefik.http.services.playwright-service.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.playwright-service.loadbalancer.healthcheck.interval=30s"
      - "traefik.http.services.playwright-service.loadbalancer.healthcheck.timeout=10s"
      - "traefik.swarm.network=traefik-public"
    deploy:
      mode: replicated
      replicas: 3
      placement:
        preferences:
          - spread: node.hostname
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          memory: 768m
        reservations:
          memory: 256m

networks:
  traefik-public:
    external: true
  traefik:
    external: true
