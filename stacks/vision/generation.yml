services:
  comfy-gpu:
    image: us-central1-docker.pkg.dev/landing-fardust/public-docker/comfyui-cuda12.8-cudnn9-runtime:0.0.0-refs-pull-2-merge.20260203-005047
    entrypoint:
      - sh
      - -c
      - |
        up=$$(cut -d. -f1 "$${STARTUP_GATE_UPTIME_FILE:-/proc/uptime}")
        slot=$${STARTUP_GATE_SLOT_S:-0}
        if [ "$$up" -lt "$$slot" ]; then
          echo "startup-gate: host uptime $${up}s is below slot $${slot}s, waiting $$((slot - up))s"
          sleep "$$((slot - up))"
        fi
        exec python -u main.py --listen --port 7860 "$$@"
      - startup-gate
    command:
      [
        "--listen",
        "--port",
        "8188",
        "--enable-manager",
        "--database-url",
        "${COMFYUI_DATABASE_URL:-sqlite:////stable-diffusion/user/comfyui.db}",
        "--multi-user",
        "--comfy-api-base",
        "https://comfy.${LOCAL_DOMAIN?err}",
        "--verbose",
        "INFO",
        "--front-end-version",
        "Comfy-Org/ComfyUI_frontend@latest",
        "--gpu-only",
        "--fast",
        "fp16_accumulation",
        "fp8_matrix_mult",
        "cublas_ops",
      ]
    volumes:
      - comfyui_data:/data
      - comfyui_custom_nodes:/data/config/comfy/custom_nodes
      - comfyui_output:/stable-diffusion/output
      - comfyui_cache:/root/.cache
      - comfyui_config:/stable-diffusion/user
      - comfyui_models:/stable-diffusion/models
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - STARTUP_GATE_SLOT_S=660
    networks:
      - traefik
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.gpu == true
          - node.labels.gpu.class == high-end
      restart_policy:
        condition: any
        delay: 165s
        max_attempts: 5
        window: 20m
      resources:
        reservations:
          memory: 4G
      labels:
        - traefik.enable=true
        - traefik.http.routers.comfy-gpu-http.entrypoints=web
        - traefik.http.routers.comfy-gpu-http.rule=Host(`comfy.${LOCAL_DOMAIN?err}`)
        - traefik.http.routers.comfy-gpu.entrypoints=websecure
        - traefik.http.routers.comfy-gpu.rule=Host(`comfy.${LOCAL_DOMAIN?err}`)
        - traefik.http.routers.comfy-gpu-http.middlewares=comfy-gpu-https@swarm
        - traefik.http.middlewares.comfy-gpu-https.redirectscheme.scheme=https
        - traefik.http.routers.comfy-gpu.tls=true
        - traefik.http.routers.comfy-gpu.tls.certresolver=le-dns
        - traefik.http.services.comfy-gpu.loadbalancer.server.port=8188

networks:
  traefik:
    external: true

volumes:
  # Keep models cached 7 days with per-volume caps and a free-space floor, as decided in docs/adr/comfyui_cache_retention_adr.md
  comfyui_custom_nodes:
    driver: rclone
    driver_opts:
      allow_non_empty: 'true'
      remote: "gcs:${GCS_SYNC_STORAGE_BUCKET?err}/comfyui/custom_nodes"
      allow_other: "true"
      vfs_cache_mode: full
      vfs_cache_max_age: 168h
      vfs_cache_max_size: 4G
      vfs_cache_min_free_space: 15G
  comfyui_data:
    driver: rclone
    driver_opts:
      allow_non_empty: 'true'
      remote: "gcs:${GCS_SYNC_STORAGE_BUCKET?err}/comfyui/data"
      allow_other: "true"
      vfs_cache_mode: full
      vfs_cache_max_age: 168h
      vfs_cache_max_size: 8G
      vfs_cache_min_free_space: 15G
  comfyui_models:
    driver: rclone
    driver_opts:
      allow_non_empty: 'true'
      remote: "gcs:${GCS_SYNC_STORAGE_BUCKET?err}/comfyui/data/models"
      allow_other: "true"
      vfs_cache_mode: full
      vfs_cache_max_age: 168h
      vfs_cache_max_size: 48G
      vfs_cache_min_free_space: 15G
  comfyui_output:
    driver: rclone
    driver_opts:
      allow_non_empty: 'true'
      remote: "gcs:${GCS_SYNC_STORAGE_BUCKET?err}/comfyui/output"
      allow_other: "true"
      vfs_cache_mode: full
      vfs_cache_max_age: 168h
      vfs_cache_max_size: 8G
      vfs_cache_min_free_space: 15G
  comfyui_config:
    driver: rclone
    driver_opts:
      allow_non_empty: 'true'
      remote: "gcs:${GCS_SYNC_STORAGE_BUCKET?err}/comfyui/config"
      allow_other: "true"
      vfs_cache_mode: full
      vfs_cache_max_age: 168h
      vfs_cache_max_size: 1G
      vfs_cache_min_free_space: 15G
  comfyui_cache:
    driver: local
