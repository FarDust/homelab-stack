version: "3.9"

networks:
  traefik-public:
    external: true
  keycloak-internal:
    driver: overlay

services:
  keycloak:
    # Pre-built image (kc.sh build at image build time) so restarts take seconds; built from stacks/main/keycloak-optimized/,
    # see docs/adr/keycloak_optimized_image_adr.md. Previous image: quay.io/keycloak/keycloak:26.4.7 with `start` (about 100 s per restart).
    image: ${KEYCLOAK_IMAGE?err}
    command:
      - start
      - --optimized
      - --http-enabled=true
      - --proxy-headers=xforwarded
      - --hostname=https://idp.${LOCAL_DOMAIN?err}
    networks:
      - traefik-public
      - keycloak-internal
    secrets:
      - source: sendgrid_smtp_password
        target: sendgrid_smtp_password
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD?err}
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-db:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD?err}
      - KC_VAULT=file
      - KC_VAULT_DIR=/run/secrets
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: ${RESTART_DELAY_STANDARD}
        max_attempts: ${RESTART_MAX_ATTEMPTS}
        window: ${RESTART_WINDOW_STANDARD}
      update_config:
        order: stop-first
        failure_action: pause
        monitor: ${UPDATE_MONITOR_STANDARD}
        max_failure_ratio: 0.3
      rollback_config:
        order: stop-first
        monitor: ${ROLLBACK_MONITOR_STANDARD}
      placement:
        constraints:
          - node.role == worker
          # Keep SSO off the ephemeral node: pinned by label like its database; see docs/adr/keycloak_pinned_placement_adr.md
          - node.labels.storage.manager == true
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.keycloak.rule=Host(`idp.${LOCAL_DOMAIN?err}`)"
        - "traefik.http.routers.keycloak.entrypoints=websecure"
        - "traefik.http.routers.keycloak.tls=true"
        - "traefik.http.routers.keycloak.tls.certresolver=le-dns"
        - "traefik.http.services.keycloak.loadbalancer.server.port=8080"
        - "traefik.swarm.network=traefik-public"

  keycloak-db:
    image: postgres:17.7
    networks:
      - keycloak-internal
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    secrets:
      - source: keycloak_db_password
        target: keycloak_db_password
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD_FILE=/run/secrets/keycloak_db_password
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: ${RESTART_DELAY_STANDARD}
        max_attempts: ${RESTART_MAX_ATTEMPTS}
        window: ${RESTART_WINDOW_STANDARD}
      update_config:
        order: stop-first
        failure_action: rollback
        monitor: ${UPDATE_MONITOR_STANDARD}
        max_failure_ratio: 0.3
      rollback_config:
        order: stop-first
        monitor: ${ROLLBACK_MONITOR_STANDARD}
      placement:
        constraints:
          - node.role == worker
          - node.labels.storage.manager == true
          - node.labels.load.tier == heavy

  vault:
    image: quay.io/openbao/openbao:2.1.0
    entrypoint: ["sh", "-c", "chown -R 100:1000 /openbao/data && exec bao server -config=/openbao/config/config.hcl"]
    user: root
    cap_add:
      - IPC_LOCK
    networks:
      - traefik-public
    configs:
      - source: openbao_config
        target: /openbao/config/config.hcl
    volumes:
      - openbao_data:/openbao/data
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
      update_config:
        order: stop-first
        failure_action: rollback
        monitor: ${UPDATE_MONITOR_STANDARD}
        max_failure_ratio: 0.3
      rollback_config:
        order: stop-first
        monitor: ${ROLLBACK_MONITOR_STANDARD}
      placement:
        constraints:
          - node.role == worker
          - node.labels.storage.manager == true
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.vault.rule=Host(`vault.${LOCAL_DOMAIN?err}`)"
        - "traefik.http.routers.vault.entrypoints=websecure"
        - "traefik.http.routers.vault.tls=true"
        - "traefik.http.routers.vault.tls.certresolver=le-dns"
        - "traefik.http.services.vault.loadbalancer.server.port=8200"
        - "traefik.swarm.network=traefik-public"

volumes:
  keycloak_db_data:
    driver: local
  openbao_data:
    driver: local

secrets:
  keycloak_db_password:
    name: keycloak_db_password-${CONFIG_VERSION:-0}
    file: ../../secrets/keycloak/postgres_password
  sendgrid_smtp_password:
    file: ../../secrets/sendgrid/smtp_password

configs:
  openbao_config:
    name: openbao_config-${CONFIG_VERSION:-0}
    file: ./configs/openbao/config.hcl
