version: '3.8'

services:
  loki:
    image: grafana/loki:3.6.4
    user: "0"
    command:
      - -config.file=/etc/loki/loki.yml
      - -config.expand-env=true
    networks:
      - traefik
    volumes:
      # Primary store on a host directory. Swarm does not create missing bind sources, so the task fails to start
      # when the directory or the marker file is absent (an empty node can never host Loki by accident). Create the
      # marker only after seeding or restoring; as decided in docs/adr/loki_local_primary_backup_adr.md
      - type: bind
        source: /var/lib/docker/loki-store
        target: /var/lib/loki
        bind:
          create_host_path: false
      - type: bind
        source: /var/lib/docker/loki-store/.loki-store-initialized
        target: /run/loki-store-initialized
        read_only: true
        bind:
          create_host_path: false
    configs:
      - source: loki_config
        target: /etc/loki/loki.yml
      - source: loki_rules_traefik
        target: /etc/loki/rules/traefik-router-conflict.yml
    environment:
      LOKI_RETENTION_PERIOD: ${LOKI_RETENTION_PERIOD:-2160h}
    # flush_on_shutdown writes the in-memory chunks to the local store; as decided in docs/adr/loki_local_primary_backup_adr.md
    stop_grace_period: 2m
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 120s
      placement:
        constraints:
          - node.labels.swarm.leader != true
          # The primary store is node-local: stay on a storage-manager node (never the ephemeral node) so
          # ephemeral-rebalance skips the service; see docs/adr/loki_pinned_placement_adr.md
          - node.labels.storage.manager == true
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.loki.rule=Host(`loki.${LOCAL_DOMAIN?err}`) && !PathPrefix(`/otlp`)"
        - "traefik.http.routers.loki.entrypoints=websecure"
        - "traefik.http.routers.loki.tls=true"
        - "traefik.http.routers.loki.tls.certresolver=le-dns"
        - "traefik.http.routers.loki-otlp.rule=Host(`loki.${LOCAL_DOMAIN?err}`) && PathPrefix(`/otlp`)"
        - "traefik.http.routers.loki-otlp.entrypoints=websecure"
        - "traefik.http.routers.loki-otlp.tls=true"
        - "traefik.http.routers.loki-otlp.tls.certresolver=le-dns"
        - "traefik.http.routers.loki-otlp.service=loki"
        - "traefik.http.routers.loki-otlp.priority=120"
        - "traefik.http.routers.loki-otlp.observability.accesslogs=false"
        - "traefik.http.routers.loki.middlewares=oauth2-proxy-forward-auth@swarm"
        - "traefik.http.middlewares.oauth2-proxy-forward-auth.forwardAuth.address=http://main-identity-gateway_oauth2-proxy:4180/oauth2/auth"
        - "traefik.http.middlewares.oauth2-proxy-forward-auth.forwardAuth.authRequestHeaders=Authorization,X-Forwarded-Host,X-Forwarded-Proto,X-Forwarded-Uri,X-Forwarded-Method"
        - "traefik.http.middlewares.oauth2-proxy-forward-auth.forwardAuth.trustForwardHeader=true"
        - "traefik.http.middlewares.oauth2-proxy-forward-auth.forwardAuth.authResponseHeaders=Authorization,X-Auth-Request-User,X-Auth-Request-Email,X-Auth-Request-Access-Token"
        - "traefik.http.services.loki.loadbalancer.server.port=3100"
        - "traefik.swarm.network=traefik"

  # Warm copy of the Loki store on the manager for failover (RPO of minutes); as decided in docs/adr/loki_local_primary_backup_adr.md
  loki-replica:
    image: rclone/rclone:1.75.2
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        [ -r /run/secrets/loki_replica_pass ] || { echo "loki-replica: secret loki_replica_pass missing" >&2; exit 1; }
        [ -d /data ] || { echo "loki-replica: /data missing" >&2; exit 1; }
        RCLONE_PASS=$$(cat /run/secrets/loki_replica_pass)
        export RCLONE_PASS
        # RCLONE_USER / RCLONE_PASS are the --user / --pass flags of serve webdav; they stay out of argv and the service spec.
        exec nice -n 19 rclone serve webdav /data --addr :8080 --vfs-cache-mode off --dir-cache-time 2m --no-checksum
    networks:
      - traefik
    volumes:
      - type: bind
        source: /var/lib/docker/loki-store
        target: /data
        bind:
          create_host_path: false
    secrets:
      - source: loki_replica_pass
        target: loki_replica_pass
        mode: 0400
    environment:
      RCLONE_USER: loki
      GOMEMLIMIT: 150MiB
      TZ: ${TIMEZONE:-UTC}
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: "0.25"
          memory: 192M
        reservations:
          cpus: "0.02"
          memory: 32M
      restart_policy:
        condition: any
        delay: 30s
      update_config:
        order: stop-first
        failure_action: rollback
      placement:
        constraints:
          # The manager side of the pair; Loki itself is pinned to the other storage node (swarm.leader != true).
          - node.labels.swarm.leader == true
          - node.labels.storage.manager == true

  # Copies new immutable Loki files to the replica (every 5 min) and, write-only, to GCS backup-store/ (every 30 min)
  loki-sync:
    image: rclone/rclone:1.75.2
    entrypoint: ["/bin/sh", "/scripts/loki-sync.sh"]
    command: ["serve"]
    networks:
      - traefik
    volumes:
      - type: bind
        source: /var/lib/docker/loki-store
        target: /source
        read_only: true
        bind:
          create_host_path: false
      - /var/lib/node_exporter/textfile_collector:/metrics
    configs:
      - source: loki_sync_script
        target: /scripts/loki-sync.sh
        mode: 0555
    secrets:
      - source: loki_gcs_sa_key
        target: loki_gcs_sa_key
        mode: 0444
      - source: loki_replica_pass
        target: loki_replica_pass
        mode: 0400
    environment:
      LOKI_SYNC_REPLICA_URL: http://loki-replica:8080
      LOKI_SYNC_REPLICA_USER: loki
      LOKI_SYNC_GCS_BUCKET: ${ARTIFACTS_GCS_BUCKET?err}
      LOKI_SYNC_GCS_PATH: ${ARTIFACTS_GCS_BUCKET?err}/loki/cluster/backup-store
      LOKI_SYNC_SCHEDULE_REPLICA: ${LOKI_SYNC_SCHEDULE_REPLICA:-*/5 * * * *}
      LOKI_SYNC_SCHEDULE_REPLICA_FULL: ${LOKI_SYNC_SCHEDULE_REPLICA_FULL:-15 3 * * *}
      LOKI_SYNC_SCHEDULE_PRUNE: ${LOKI_SYNC_SCHEDULE_PRUNE:-30 4 * * *}
      LOKI_SYNC_SCHEDULE_GCS: ${LOKI_SYNC_SCHEDULE_GCS:-7,37 * * * *}
      LOKI_SYNC_SCHEDULE_GCS_FULL: ${LOKI_SYNC_SCHEDULE_GCS_FULL:-45 3 * * *}
      LOKI_SYNC_SCHEDULE_CHECK: ${LOKI_SYNC_SCHEDULE_CHECK:-0 5 * * *}
      LOKI_SYNC_PSI_MAX_AVG60: ${LOKI_SYNC_PSI_MAX_AVG60:-40}
      # Longer than the 30 minute GCS copy interval so the check never counts files that are simply not yet due
      LOKI_SYNC_CHECK_MIN_AGE: ${LOKI_SYNC_CHECK_MIN_AGE:-45m}
      TZ: ${TIMEZONE:-UTC}
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 32M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 120s
      update_config:
        order: stop-first
        failure_action: rollback
      placement:
        constraints:
          # Same placement as loki: next to /var/lib/docker/loki-store.
          - node.labels.swarm.leader != true
          - node.labels.storage.manager == true

  alertmanager:
    image: prom/alertmanager:v0.31.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    networks:
      - traefik
    volumes:
      - alertmanager-data:/alertmanager
    configs:
      - source: alertmanager_config
        target: /etc/alertmanager/alertmanager.yml
    secrets:
      - source: grafana_routine_n8n_webhook_url
        target: grafana_routine_n8n_webhook_url
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 120s
      placement:
        constraints:
          - node.labels.swarm.leader != true

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.140.0@sha256:ffc818ee108d0b934fd14207fd87ff247c9b64f344ed349d0b66c166c18a2312
    command:
      - --config=/etc/otel-collector/otel-collector.yml
    networks:
      - traefik
    configs:
      - source: otel_collector_config
        target: /etc/otel-collector/otel-collector.yml
    environment:
      - OTEL_COLLECTOR_REDIS_ENDPOINT=redis.${LOCAL_DOMAIN?err}:${INTERNAL_PORT:-5578}
      - OTEL_COLLECTOR_REDIS_DB=2
      - OTEL_COLLECTOR_REDIS_SERVER_NAME=redis.${LOCAL_DOMAIN?err}
      - OTEL_COLLECTOR_LOKI_ENDPOINT=https://loki.${LOCAL_DOMAIN?err}/otlp
      - REDIS_PASSWORD=${REDIS_PASSWORD?err}
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M
      placement:
        constraints:
          - node.role == manager
          - node.labels.node.ephemeral != true
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.otel-collector.rule=Host(`otel-collector.${LOCAL_DOMAIN?err}`)"
        - "traefik.http.routers.otel-collector.entrypoints=websecure"
        - "traefik.http.routers.otel-collector.tls=true"
        - "traefik.http.routers.otel-collector.tls.certresolver=le-dns"
        - "traefik.http.routers.otel-collector.service=otel-collector"
        - "traefik.http.services.otel-collector.loadbalancer.server.port=4318"
        - "traefik.http.routers.otel-collector.observability.accesslogs=false"
        - "traefik.swarm.network=traefik"

  vector:
    image: timberio/vector:0.53.0-alpine
    command:
      - --config
      - /etc/vector/vector.yml
    networks:
      - traefik
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - vector-data:/var/lib/vector
    configs:
      - source: vector_config
        target: /etc/vector/vector.yml
    security_opt:
      - no-new-privileges:true
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M

networks:
  traefik:
    external: true

volumes:
  # WAL and caches only (replayable); an empty volume is harmless
  loki-state:
    driver: local
  # Legacy filesystem store, kept untouched until sign-off; still mounted by loki-backup
  loki-data:
    driver: local
  vector-data:
    driver: local
  alertmanager-data:
    driver: local

configs:
  loki_config:
    name: loki_config-${CONFIG_VERSION:-0}
    file: ./configs/logging/loki.yml
  loki_sync_script:
    name: loki_sync_script-${CONFIG_VERSION:-0}
    file: ./configs/logging/loki-sync.sh
  loki_rules_traefik:
    name: loki_rules_traefik-${CONFIG_VERSION:-0}
    file: ./configs/logging/rules/traefik-router-conflict.yml
  alertmanager_config:
    name: alertmanager_config-${CONFIG_VERSION:-0}
    file: ./configs/logging/alertmanager.yml
  vector_config:
    name: vector_config-${CONFIG_VERSION:-0}
    file: ./configs/logging/vector.yml
  otel_collector_config:
    name: otel_collector_config-${CONFIG_VERSION:-0}
    file: ./configs/logging/otel-collector.yml

secrets:
  loki_gcs_sa_key:
    external: true
    name: loki_gcs_sa_key
  loki_replica_pass:
    external: true
    name: loki_replica_pass_2
  gcp_sa:
    name: gcp_sa-${CONFIG_VERSION:-0}
    file: ../../secrets/google/gcloud.json
  grafana_routine_n8n_webhook_url:
    external: true
    name: main-traefik_grafana_routine_n8n_webhook_url
