  - orgId: 1
    name: Workload and log durability alerts
    folder: Behavioral
    interval: 60s
    rules:
      - uid: swarm_task_churn
        title: Swarm Service Task Churn
        condition: C
        data:
          - refId: A
            datasourceUid: PBFA97CFB590B2093
            relativeTimeRange:
              from: 1800
              to: 0
            model:
              datasource:
                type: prometheus
                uid: PBFA97CFB590B2093
              editorMode: code
              expr: |-
                max by (container_label_com_docker_swarm_service_name) (
                  count by (container_label_com_docker_swarm_service_name, container_label_com_docker_swarm_node_id) (
                    count by (container_label_com_docker_swarm_service_name, container_label_com_docker_swarm_node_id, container_label_com_docker_swarm_task_id) (
                      count_over_time(container_start_time_seconds{container_label_com_docker_swarm_service_name!=""}[30m])
                    )
                  )
                ) >= 5
              intervalMs: 15000
              legendFormat: '{{ container_label_com_docker_swarm_service_name }}'
              maxDataPoints: 43200
              instant: true
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
