          - refId: A
            datasourceUid: PBFA97CFB590B2093
            relativeTimeRange:
              from: 900
              to: 0
            model:
              datasource:
                type: prometheus
                uid: PBFA97CFB590B2093
              editorMode: code
              expr: |-
                time() - max(loki_sync_last_success_timestamp_seconds{target="replica",mode="incr"}) - 1200
              intervalMs: 15000
              legendFormat: '{{ target }}'
              maxDataPoints: 43200
              instant: true
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Error
        for: 5m
        annotations:
          summary: "Loki warm copy on the second node is more than 20 minutes behind"
          description: "The 5 minute incremental copy of the Loki store to main-logging_loki-replica has not succeeded for over 20 minutes (failover RPO target: minutes). Check main-logging_loki-sync logs, host I/O pressure and the replica service on the manager."
        labels:
          severity: warning
          tier: maintenance
          service: loki-sync
      - uid: loki_gcs_copy_stale
        title: Loki GCS Backup Copy Stale
        condition: C
