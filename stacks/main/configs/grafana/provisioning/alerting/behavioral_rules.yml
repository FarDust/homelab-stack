          - refId: A
            datasourceUid: P8E80F9AEF21F6940
            relativeTimeRange:
              from: 600
              to: 0
            model:
              datasource:
                type: loki
                uid: P8E80F9AEF21F6940
              editorMode: code
              expr: |-
                sum by (service_name) (rate({service_name=~".+", service_name!~"main-storage_postgres"}[5m]))
              intervalMs: 15000
              legendFormat: '{{ service_name }}'
              maxDataPoints: 43200
              queryType: instant
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              settings:
                mode: dropNN
              type: reduce
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              conditions:
                - evaluator:
                    params:
