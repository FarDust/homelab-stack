          description: "Service {{ $labels.service_name }} sustained more than 50 log lines/s for 10 minutes (normal services stay below 5; the 2026-10-12 Infinity crash loop wrote about 83/s). Check restarts, error loops and Loki ingestion volume."
        labels:
