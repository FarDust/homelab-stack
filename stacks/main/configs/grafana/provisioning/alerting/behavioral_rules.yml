                uid: PBFA97CFB590B2093
              editorMode: code
              expr: |-
                time() - max(loki_sync_last_success_timestamp_seconds{target="gcs",mode="incr"}) - 5400
              intervalMs: 15000
              legendFormat: '{{ target }}'
              maxDataPoints: 43200
