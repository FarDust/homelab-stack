apiVersion: 1

# The tar archive job (loki-backup) was replaced by loki-sync on 2026-10-13; see docs/adr/loki_local_primary_backup_adr.md
deleteRules:
  - orgId: 1
    uid: loki_backup_stale

groups:
  - orgId: 1
    name: Anomaly Alerts
    folder: Behavioral
    interval: 300s
    rules:
      - uid: eet9u4cbi0jcwa
        title: Spike Radar 1h
        condition: C
        data:
          - refId: A
            datasourceUid: PBFA97CFB590B2093
            relativeTimeRange:
              from: 21600
              to: 0
            model:
              adhocFilters: []
              datasource:
                type: prometheus
                uid: PBFA97CFB590B2093
              editorMode: code
              expr: |-
                (
                  clamp_min(
                    avg_over_time(
                      (
                        sum(rate(container_network_receive_bytes_total[1m]))
                      + sum(rate(container_network_transmit_bytes_total[1m]))
                      )[6m:1m]
                    )
                    -
                    avg_over_time(
                      (
                        sum(rate(container_network_receive_bytes_total[1m]))
                      + sum(rate(container_network_transmit_bytes_total[1m]))
                      )[6m:1m] offset 1h
                    )
                  , 0)
                )
                /
                clamp_min(
                  (
                    quantile_over_time(
                      0.95,
                      (
                        avg_over_time(
                          (
                            sum(rate(container_network_receive_bytes_total[1m]))
                          + sum(rate(container_network_transmit_bytes_total[1m]))
                          )[6m:1m]
                        )
                      )[6h:1m] offset 1h
                    )
                    or
                    quantile_over_time(
                      0.95,
                      (
                        avg_over_time(
                          (
                            sum(rate(container_network_receive_bytes_total[1m]))
                          + sum(rate(container_network_transmit_bytes_total[1m]))
                          )[6m:1m]
                        )
                      )[6h:1m] offset 2h
                    )
                  )
                , 1e6)
              instant: true
              interval: ""
              intervalMs: 15000
              legendFormat: Spike score 1h
              maxDataPoints: 43200
              range: false
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              conditions:
                - evaluator:
                    params:
                      - 2
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        dashboardUid: 3b22f0de-d83f-49c0-b6ec-7f010c4a7b43
        panelId: 1
        noDataState: OK
        execErrState: OK
        for: 10m
        annotations:
          __dashboardUid__: 3b22f0de-d83f-49c0-b6ec-7f010c4a7b43
          __panelId__: "1"
          description: 6m smoothed RX+TX vs 1h-offset p95 baseline with fallback. Triggers when score > 2 for 10m. Ignores the hourly speedtest. Check speedtest jobs, batch runs, recent deploys.
          summary: "Network burst beyond 1h pattern"
        labels:
          tier: anomaly
  - orgId: 1
    name: Common alerts
    folder: Behavioral
    interval: 60s
    rules:
      - uid: ceslnd3qpgetcc
        title: Blocked Queries
        condition: B
        data:
          - refId: blocked
            datasourceUid: PBFA97CFB590B2093
            relativeTimeRange:
              from: 21600
              to: 0
            model:
              adhocFilters: []
              datasource:
                type: prometheus
                uid: PBFA97CFB590B2093
              disableTextWrap: false
              editorMode: code
              exemplar: false
              expr: |-
                (
                  rate(nextdns_blocked_queries_total{profile="${NEXTDNS_PROFILE_ID}"}[5m])
                  /
                  avg_over_time(rate(nextdns_queries_total{profile="${NEXTDNS_PROFILE_ID}"}[5m])[1h:])
                )
              fullMetaSearch: false
              includeNullMetadata: true
              instant: true
              interval: ""
              intervalMs: 15000
              legendFormat: Blocked
              maxDataPoints: 43200
              range: false
              refId: blocked
              useBackend: false
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    type: avg
                  type: query
              datasource:
                name: Expression
                type: __expr__
                uid: __expr__
              expression: blocked
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        dashboardUid: MwiWGgFVz
        panelId: 8
        noDataState: OK
        execErrState: OK
        for: 1m
        annotations:
          __dashboardUid__: MwiWGgFVz
          __panelId__: "8"
          runbook_url: https://my.nextdns.io/${NEXTDNS_PROFILE_ID}/logs
          summary: "DNS alert: unusual spike in blocked DNS requests detected. Investigate possible misconfigurations, bad actors, or setup failure."
        labels:
          service: nextdns
          tier: security
  - orgId: 1
    name: Host resource alerts
    folder: Behavioral
    interval: 60s
    rules:
      - uid: host_low_swap_available
        title: Host Low Swap Available
        condition: C
        data:
          - refId: A
            datasourceUid: PBFA97CFB590B2093
            relativeTimeRange:
              from: 900
              to: 0
            model:
              datasource:
                type: prometheus
                uid: PBFA97CFB590B2093
              editorMode: code
              expr: |-
                node_memory_SwapTotal_bytes > 0
                and on(instance, job)
                (node_memory_SwapFree_bytes / node_memory_SwapTotal_bytes < 0.25)
              instant: true
              interval: ""
              intervalMs: 15000
              legendFormat: '{{ instance }}'
              maxDataPoints: 43200
              range: false
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: "Host {{ $labels.instance }} has low swap available"
          description: "{{ $labels.instance }} has less than 25% swap free for more than 10 minutes. Check Netdata, memory-heavy workloads, recent deploys, and swap growth before changing placements or host daemons."
        labels:
          tier: maintenance
          service: host-resources
