          description: "main-storage_postgres sustained more than 250 log lines/s for 10 minutes. Its observed baseline on 2026-10-13 was about 133 lines/s while a connection-error storm was being fixed; re-baseline after that fix."
        labels:
          severity: warning
          tier: maintenance
          service: log-volume
      - uid: loki_replica_stale
        title: Loki Replica Copy Stale
        condition: C
