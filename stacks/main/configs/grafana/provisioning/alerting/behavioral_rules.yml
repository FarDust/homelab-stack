        labels:
          severity: warning
          tier: maintenance
          service: loki-sync
      - uid: loki_sync_run_failed
        title: Loki Sync Run Failed
        condition: C
        data:
          - refId: A
            datasourceUid: PBFA97CFB590B2093
            relativeTimeRange:
              from: 900
              to: 0
            model:
              datasource:
                type: prometheus
                uid: PBFA97CFB590B2093
              editorMode: code
              expr: |-
                count(loki_sync_last_run_success == 0) or vector(0)
              intervalMs: 15000
              legendFormat: '{{ target }}'
              maxDataPoints: 43200
              instant: true
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              conditions:
                - evaluator:
