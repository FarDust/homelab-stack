          tier: maintenance
          service: log-volume
      - uid: loki_log_rate_postgres_high
        title: PostgreSQL Log Rate High
        condition: C
        data:
          - refId: A
            datasourceUid: P8E80F9AEF21F6940
            relativeTimeRange:
              from: 600
              to: 0
            model:
              datasource:
                type: loki
                uid: P8E80F9AEF21F6940
              editorMode: code
              expr: |-
                sum by (service_name) (rate({service_name="main-storage_postgres"}[5m]))
              intervalMs: 15000
              legendFormat: '{{ service_name }}'
              maxDataPoints: 43200
              queryType: instant
