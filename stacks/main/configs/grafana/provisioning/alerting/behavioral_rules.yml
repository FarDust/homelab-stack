                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 15m
        annotations:
          summary: "A loki-sync run failed (replica or GCS)"
          description: "The last loki-sync run for at least one target or mode reported failure (a guard refusal also counts). See main-logging_loki-sync logs."
        labels:
          severity: warning
          tier: maintenance
          service: loki-sync
      - uid: loki_sync_check_problem
        title: Loki Sync Check Found Missing Files
        condition: C
        data:
          - refId: A
            datasourceUid: PBFA97CFB590B2093
            relativeTimeRange:
              from: 900
              to: 0
            model:
              datasource:
                type: prometheus
                uid: PBFA97CFB590B2093
              editorMode: code
              expr: |-
                count((loki_sync_missing_files{mode="check"} > 0) or (loki_sync_differ_files{mode="check"} > 0)) or vector(0)
