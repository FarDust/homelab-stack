apiVersion: 1

policies:
  - orgId: 1
    receiver: grafana-routine-n8n
    group_by:
      - grafana_folder
      - alertname
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: grafana-default-broadcast
        object_matchers:
          - ['tier', '=', 'core']
        continue: true
      - receiver: grafana-routine-n8n
        object_matchers:
          - ['tier', '=', 'core']
      - receiver: grafana-default-broadcast
        object_matchers:
          - ['tier', '=', 'security']
        continue: true
      - receiver: grafana-routine-n8n
        object_matchers:
          - ['tier', '=', 'security']
      - receiver: grafana-default-broadcast
        object_matchers:
          - ['tier', '=', 'anomaly']
        continue: true
      - receiver: grafana-routine-n8n
        object_matchers:
          - ['tier', '=', 'anomaly']
