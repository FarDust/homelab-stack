# config file version
apiVersion: 1

# list of datasources to insert/update depending
# whats available in the database
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    orgId: 1
    url: http://trusted-prometheus:9090
    basicAuth: false
    isDefault: true
    jsonData:
      graphiteVersion: "1.1"
      tlsAuth: false
      tlsAuthWithCACert: false
    editable: true
  - name: Loki
    type: loki
    access: proxy
    orgId: 1
    uid: P8E80F9AEF21F6940
    # Direct overlay URL, like Prometheus above and the Vector write path. The routed
    # https://loki.<domain> endpoint needs a 5-minute OIDC bearer; its refresher stalled
    # for 9 h on 2026-10-12 and left the datasource at 401.
    # As decided in docs/adr/grafana_loki_direct_datasource_adr.md
    url: http://loki:3100
    basicAuth: false
    isDefault: false
    editable: true
