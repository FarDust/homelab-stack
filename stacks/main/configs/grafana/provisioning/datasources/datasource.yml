# config file version
apiVersion: 1

# list of datasources to insert/update depending
# whats available in the database
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    orgId: 1
    url: http://trusted-prometheus:9090
    basicAuth: false
    isDefault: true
    jsonData:
      graphiteVersion: "1.1"
      tlsAuth: false
      tlsAuthWithCACert: false
    editable: true
  - name: Loki
    type: loki
    access: proxy
    orgId: 1
    uid: P8E80F9AEF21F6940
    url: ${GRAFANA_LOKI_URL}
    basicAuth: false
    isDefault: false
    editable: true
    jsonData:
      httpHeaderName1: Authorization
