auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /var/lib/loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# Single period edited in place: migrated data keeps the same schema (tsdb v13, 24h, index_ prefix),
# so only object_store changes from filesystem to gcs. As decided in docs/adr/loki_gcs_native_storage_adr.md
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: gcs
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  # Experimental in 3.6.4 but verified for chunks, TSDB index and compactor/delete-requests.
  object_prefix: loki/cluster/data/
  gcs:
    bucket_name: ${ARTIFACTS_GCS_BUCKET}
    request_timeout: 60s
    # Credentials: GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/loki_gcs_sa_key (Docker secret loki_gcs_sa_key)
  tsdb_shipper:
    active_index_directory: /var/lib/loki/index
    cache_location: /var/lib/loki/index_cache

chunk_store_config:
  chunk_cache_config:
    embedded_cache:
      enabled: true
      max_size_mb: 256
      ttl: 1h

ingester:
  wal:
    enabled: true
    dir: /var/lib/loki/wal
    flush_on_shutdown: true

compactor:
  working_directory: /var/lib/loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 50
  delete_request_store: gcs

limits_config:
  retention_period: ${LOKI_RETENTION_PERIOD}
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  allow_structured_metadata: true

ruler:
  storage:
    type: local
    local:
      directory: /etc/loki/rules
  rule_path: /etc/loki/rules
  alertmanager_url: http://alertmanager:9093
  ring:
    kvstore:
      store: inmemory
