data_dir: ${VECTOR_DATA_DIR:-/var/lib/vector}

sources:
  docker_logs:
    type: docker_logs
    docker_host: "unix:///var/run/docker.sock"
    exclude_containers:
      - main-logging_vector

transforms:
  enrich_docker:
    type: remap
    inputs: [docker_logs]
    source: |
      .job = "docker"
      if exists(.label."com.docker.swarm.service.name") && !is_null(.label."com.docker.swarm.service.name") {
        .service_name = to_string!(.label."com.docker.swarm.service.name")
      } else if exists(.container_name) && !is_null(.container_name) {
        container_name = to_string!(.container_name)
        .service_name = replace(container_name, r'\.[^.]+\.[^.]+$', "")
      } else {
        .service_name = "unknown"
      }

sinks:
  loki:
    type: loki
    inputs: [enrich_docker]
    endpoint: "http://loki:3100"
    encoding:
      codec: json
    labels:
      job: "docker"
      service_name: "{{ service_name }}"
      node: "{{ host }}"
