email_domains = [ "*" ]
scope = "openid email profile"
# Service-account / client_credentials JWTs often have unverified or missing email; bearer auth still needs to pass.
insecure_oidc_allow_unverified_email = true
# Restrict login/session to members of these Keycloak groups (claim name `groups`).
allowed_groups = [ "admin", "mlflow-admin" ]
oidc_groups_claim = "groups"
upstreams = [ "static://200" ]
skip_jwt_bearer_tokens = true
set_authorization_header = true
pass_authorization_header = true
cookie_secure = true
cookie_samesite = "lax"
skip_provider_button = true
