modules:
  http_2xx:
    prober: http
    timeout: 10s
  http_status_401:
    prober: http
    timeout: 10s
    http:
      valid_status_codes: [401]
  tcp_connect:
    prober: tcp
    timeout: 5s
  icmp:
    prober: icmp
    timeout: 5s
  dns:
    prober: dns
    timeout: 5s
    dns:
      query_name: "example.com"
      query_type: "A"
