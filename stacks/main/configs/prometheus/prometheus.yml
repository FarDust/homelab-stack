# my global config
global:
  scrape_interval: 15s # By default, scrape targets every 15 seconds.
  evaluation_interval: 15s # By default, scrape targets every 15 seconds.
  # scrape_timeout is set to the global default (10s).

  # Attach these labels to any time series or alerts when communicating with
  # external systems (federation, remote storage, Alertmanager).
  external_labels:
    monitor: "personal-stack"

# Load and evaluate rules in this file every 'evaluation_interval' seconds.
rule_files:
  - "alert.rules"
  # - "first.rules"
  # - "second.rules"

# alert
# alerting:
#   alertmanagers:
#   - scheme: http
#     static_configs:
#     - targets:
#       - "alertmanager:9093"

# A scrape configuration containing exactly one endpoint to scrape:
# Here it's Prometheus itself.
scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.

  - job_name: "prometheus"

    # Override the global default and scrape targets from this job every 5 seconds.
    scrape_interval: 5s

    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "cadvisor"
    scrape_interval: 15s

    dns_sd_configs:
      - names:
          - "tasks.cadvisor"
        type: "A"
        port: 8080

  - job_name: "node-exporter"
    scrape_interval: 15s

    dns_sd_configs:
      - names:
          - "tasks.node-exporter"
        type: "A"
        port: 9100

    relabel_configs:
    - source_labels: [__meta_dockerswarm_task_node_id]
      target_label: node_id

    - source_labels: [__meta_dockerswarm_node_hostname]
      target_label: node_hostname

  - job_name: "traefik"
    # Override the global default and scrape targets from this job every 5 seconds.
    scrape_interval: 5s

    dns_sd_configs:
      - names:
          - "tasks.traefik"
        type: "A"
        port: 8080

  - job_name: "blackbox"
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/blackbox_targets.yaml
        refresh_interval: 1m
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: "blackbox-exporter"
    static_configs:
      - targets: ["blackbox-exporter:9115"]

  - job_name: "docker-health"
    dns_sd_configs:
      - names:
          - "tasks.docker-health-telegraf"
        type: "A"
        port: 9273

  - job_name: "netdata"
    scheme: https
    metrics_path: /api/v1/allmetrics
    params:
      format: [prometheus_all_hosts]
    honor_labels: true
    tls_config:
      insecure_skip_verify: true
    dns_sd_configs:
      - names:
          - "tasks.netdata-parent"
        type: "A"
        port: 19999

  - job_name: 'grafana'

    scrape_interval: 15s
    scrape_timeout: 5s

    dns_sd_configs:
      - names:
          - "tasks.grafana"
        type: "A"
        port: 3000

  - job_name: 'crowdsec'
    metrics_path: /metrics
    scrape_interval: 15s
    dns_sd_configs:
    - names:
        - "tasks.crowdsec"
      type: "A"
      port: 6060
  - job_name: nextdns
    scrape_interval: 10s
    dns_sd_configs:
    - names:
        - "tasks.nextdns-exporter"
      type: "A"
      port: 9948

  - job_name: "postgres-exporter"
    scrape_interval: 15s
    dns_sd_configs:
      - names:
          - "tasks.postgres-exporter"
        type: "A"
        port: 9187

  - job_name: "volcano-scheduler"
    scrape_interval: 15s
    metrics_path: /metrics
    scheme: https
    tls_config:
      insecure_skip_verify: false
    static_configs:
      - targets:
          - "volcano-scheduler.${LOCAL_DOMAIN?err}:8443"
        labels:
          namespace: "volcano-system"
          component: "scheduler"

  - job_name: "volcano-controllers"
    scrape_interval: 15s
    metrics_path: /metrics
    scheme: https
    tls_config:
      insecure_skip_verify: false
    static_configs:
      - targets:
          - "volcano-controllers.${LOCAL_DOMAIN?err}:8443"
        labels:
          namespace: "volcano-system"
          component: "controllers"

  - job_name: "mtu-network-exporter"
    scrape_interval: 30s
    dns_sd_configs:
      - names:
          - "tasks.mtu-probe"
        type: "A"
        port: 9427
    relabel_configs:
      - source_labels: [__address__]
        regex: "([^:]+):.*"
        target_label: source_ip
        replacement: "$1"
  - job_name: "mtu-blackbox"
    scrape_interval: 30s
    metrics_path: /probe
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/mtu_blackbox_targets.yaml
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [module]
        target_label: __param_module
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: tasks.mtu-blackbox:9115
