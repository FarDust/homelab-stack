# my global config
global:
  scrape_interval: 15s # By default, scrape targets every 15 seconds.
  evaluation_interval: 15s # By default, scrape targets every 15 seconds.
  # scrape_timeout is set to the global default (10s).

  # Attach these labels to any time series or alerts when communicating with
  # external systems (federation, remote storage, Alertmanager).
  external_labels:
    monitor: "personal-stack"

# Load and evaluate rules in this file every 'evaluation_interval' seconds.
rule_files:
  - "alert.rules"
  # - "first.rules"
  # - "second.rules"

# Alert delivery stays independent of Grafana so Grafana outages can still notify.
alerting:
  alertmanagers:
    - scheme: http
      static_configs:
        - targets:
            - "alertmanager:9093"

# A scrape configuration containing exactly one endpoint to scrape:
# Here it's Prometheus itself.
scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.

  - job_name: "prometheus"

    # Override the global default and scrape targets from this job every 5 seconds.
    scrape_interval: 5s

    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "cadvisor"
    scrape_interval: 15s

    dns_sd_configs:
      - names:
          - "tasks.cadvisor"
        type: "A"
        port: 8080

  - job_name: "node-exporter"
    scrape_interval: 15s

    dns_sd_configs:
      - names:
          - "tasks.node-exporter"
        type: "A"
        port: 9100

    relabel_configs:
    - source_labels: [__meta_dockerswarm_task_node_id]
      target_label: node_id

    - source_labels: [__meta_dockerswarm_node_hostname]
      target_label: node_hostname

    metric_relabel_configs:
    - source_labels: [nodename]
      target_label: nodename
      action: lowercase

  - job_name: "traefik"
    # Override the global default and scrape targets from this job every 5 seconds.
    scrape_interval: 5s

    dns_sd_configs:
      - names:
          - "tasks.traefik"
        type: "A"
        port: 8080

  - job_name: "blackbox"
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/blackbox_targets.yaml
          - /etc/prometheus/targets/ingress_blackbox_targets.yaml
        refresh_interval: 1m
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - source_labels: [module]
        regex: "(.+)"
        target_label: __param_module
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: "blackbox-exporter"
    static_configs:
      - targets: ["blackbox-exporter:9115"]

  - job_name: "docker-health"
    dns_sd_configs:
      - names:
          - "tasks.docker-health-telegraf"
        type: "A"
        port: 9273

  - job_name: "netdata"
    scheme: https
    metrics_path: /api/v1/allmetrics
    params:
      format: [prometheus_all_hosts]
    honor_labels: true
    tls_config:
      insecure_skip_verify: true
    dns_sd_configs:
      - names:
          - "tasks.netdata-parent"
        type: "A"
        port: 19999

  - job_name: 'grafana'

    scrape_interval: 15s
    scrape_timeout: 5s

    dns_sd_configs:
      - names:
          - "tasks.grafana"
        type: "A"
        port: 3000

  - job_name: 'crowdsec'
    metrics_path: /metrics
    scrape_interval: 15s
    dns_sd_configs:
    - names:
        - "tasks.crowdsec"
      type: "A"
      port: 6060
  - job_name: nextdns
    scrape_interval: 10s
    dns_sd_configs:
    - names:
        - "tasks.nextdns-exporter"
      type: "A"
      port: 9948

  - job_name: "postgres-exporter"
    scrape_interval: 15s
    dns_sd_configs:
      - names:
          - "tasks.postgres-exporter"
        type: "A"
        port: 9187

  # DISABLED 2026-11-06: the Kubernetes/Volcano cluster is retired and nothing serves :8443,
  # so these jobs only produced blocked probes. To re-enable, uncomment both jobs, make sure
  # targets/volcano_target.yaml is populated, bump CONFIG_VERSION and redeploy the main stack.
  # See docs/adr/prometheus_volcano_targets_disabled_adr.md.
  # - job_name: "volcano-scheduler"
  #   scrape_interval: 15s
  #   metrics_path: /metrics
  #   scheme: https
  #   tls_config:
  #     insecure_skip_verify: false
  #   file_sd_configs:
  #     - files:
  #         - /etc/prometheus/targets/volcano_target.yaml
  #       refresh_interval: 30s
  #   relabel_configs:
  #     - source_labels: [component]
  #       regex: scheduler
  #       action: keep
  #
  # - job_name: "volcano-controllers"
  #   scrape_interval: 15s
  #   metrics_path: /metrics
  #   scheme: https
  #   tls_config:
  #     insecure_skip_verify: false
  #   file_sd_configs:
  #     - files:
  #         - /etc/prometheus/targets/volcano_target.yaml
  #       refresh_interval: 30s
  #   relabel_configs:
  #     - source_labels: [component]
  #       regex: controllers
  #       action: keep

  - job_name: "rclone-vfs"
    scrape_interval: 30s
    dns_sd_configs:
      - names:
          - "tasks.rclone-metrics-proxy"
        type: "A"
        port: 5572

  - job_name: "mtu-network-exporter"
    scrape_interval: 30s
    dns_sd_configs:
      - names:
          - "tasks.mtu-probe"
        type: "A"
        port: 9427
    relabel_configs:
      - source_labels: [__address__]
        regex: "([^:]+):.*"
        target_label: source_ip
        replacement: "$1"
  - job_name: "mtu-blackbox"
    scrape_interval: 30s
    metrics_path: /probe
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/mtu_blackbox_targets.yaml
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [module]
        target_label: __param_module
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: tasks.mtu-blackbox:9115

  - job_name: "gpu-idle-lab-otel"
    scrape_interval: 15s
    scrape_timeout: 5s
    honor_timestamps: true
    track_timestamps_staleness: true
    dns_sd_configs:
      - names:
          - "tasks.otel-collector"
        type: "A"
        port: 8889
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "gpu_idle_lab_phase_duration_seconds|gpu_idle_lab_phase_finished_timestamp_seconds|gpu_idle_lab_phase_work_completed|gpu_idle_lab_phase_work_per_second"
        action: keep
      - regex: "run_id|experiment_id|worker_id|pid|process_pid|trace_id|span_id|path|file_path|artifact|hash|exported_job|otel_scope_name|otel_scope_version|service_name"
        action: labeldrop

  # Optional NVIDIA exporter targets are supplied by deployment configuration.
  - job_name: nvidia-gpu
    scrape_interval: 15s
    scrape_timeout: 10s
    scheme: https
    file_sd_configs:
      - files: [/etc/prometheus/targets/nvidia_targets.yml]
        refresh_interval: 1m
    tls_config:
      insecure_skip_verify: false
