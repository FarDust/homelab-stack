# my global config
global:
  scrape_interval: 15s # By default, scrape targets every 15 seconds.
  evaluation_interval: 15s # By default, scrape targets every 15 seconds.
  # scrape_timeout is set to the global default (10s).

  # Attach these labels to any time series or alerts when communicating with
  # external systems (federation, remote storage, Alertmanager).
  external_labels:
    monitor: "personal-stack"

# Load and evaluate rules in this file every 'evaluation_interval' seconds.
rule_files:
  - "alert.rules"
  # - "first.rules"
  # - "second.rules"

# alert
# alerting:
#   alertmanagers:
#   - scheme: http
#     static_configs:
#     - targets:
#       - "alertmanager:9093"

# A scrape configuration containing exactly one endpoint to scrape:
# Here it's Prometheus itself.
scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.

  - job_name: "prometheus"

    # Override the global default and scrape targets from this job every 5 seconds.
    scrape_interval: 5s

    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "cadvisor"
    scrape_interval: 15s

    dns_sd_configs:
      - names:
          - "tasks.cadvisor"
        type: "A"
        port: 8080

  - job_name: "node-exporter"
    scrape_interval: 15s

    dns_sd_configs:
      - names:
          - "tasks.node-exporter"
        type: "A"
        port: 9100

    relabel_configs:
    - source_labels: [__meta_dockerswarm_task_node_id]
      target_label: node_id

    - source_labels: [__meta_dockerswarm_node_hostname]
      target_label: node_hostname

  - job_name: "traefik"
    # Override the global default and scrape targets from this job every 5 seconds.
    scrape_interval: 5s

    dns_sd_configs:
      - names:
          - "tasks.traefik"
        type: "A"
        port: 8080

  # - job_name: "netdata"

  #   metrics_path: /api/v1/allmetrics
  #   params:
  #     format: [prometheus]

  #   dns_sd_configs:
  #     - names:
  #         - "tasks.netdata"
  #       type: "A"
  #       port: 19999

  - job_name: watchtower
    scrape_interval: 15m
    metrics_path: /v1/metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/watchtower_auth_token
    dns_sd_configs:
      - names:
          - "tasks.watchtower"
        type: "A"
        port: 8080

  - job_name: 'grafana'

    scrape_interval: 15s
    scrape_timeout: 5s

    dns_sd_configs:
      - names:
          - "tasks.grafana"
        type: "A"
        port: 3000

  - job_name: "supabase"
    metrics_path: "/customer/v1/privileged/metrics"
    scheme: https
    basic_auth:
      username: "service_role"
      password_file: /run/secrets/supabase_service_role_key
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/supabase_target.yaml
        refresh_interval: 1m
  - job_name: 'crowdsec'
    metrics_path: /metrics
    scrape_interval: 15s
    dns_sd_configs:
    - names:
        - "tasks.crowdsec"
      type: "A"
      port: 6060
  - job_name: nextdns
    scrape_interval: 10s
    dns_sd_configs:
    - names:
        - "tasks.nextdns-exporter"
      type: "A"
      port: 9948
  - job_name: speedtest
    scrape_interval: 60m
    scrape_timeout:  60s
    dns_sd_configs:
      - names:
          - "tasks.speedtest-exporter"
        type: "A"
        port: 9090
