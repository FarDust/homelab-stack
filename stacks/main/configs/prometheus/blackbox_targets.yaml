- targets:
  - http://trusted-prometheus:9090/-/ready
  labels:
    probe: monitoring_prometheus_vip
    monitor_group: monitoring_path

- targets:
  - http://tasks.prometheus:9090/-/ready
  labels:
    probe: monitoring_prometheus_task
    monitor_group: monitoring_path

- targets:
  - storage.googleapis.com:443
  labels:
    probe: critical_storage_googleapis_com
    service: storage.googleapis.com
    monitor_group: critical_external_dns
    expected_status: tls
    module: tls_connect

