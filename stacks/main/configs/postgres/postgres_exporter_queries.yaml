pg_kine_table:
  query: |
    SELECT
      count(*)::double precision AS rows,
      count(DISTINCT name)::double precision AS distinct_keys,
      max(id)::double precision AS max_revision
    FROM kine;
  metrics:
    - rows:
        usage: "GAUGE"
        description: "Total live rows currently present in the kine table."
    - distinct_keys:
        usage: "GAUGE"
        description: "Distinct object keys currently present in the kine table."
    - max_revision:
        usage: "GAUGE"
        description: "Highest revision id currently present in the kine table."

pg_kine_hot_prefixes:
  query: |
    SELECT
      prefix,
      revisions::double precision AS revisions
    FROM (
      SELECT
        CASE
          WHEN name LIKE '/registry/longhorn.io/%' THEN 'longhorn.io'
          WHEN name LIKE '/registry/persistentvolumes/%' THEN 'persistentvolumes'
          WHEN name LIKE '/registry/leases/%' THEN 'leases'
          WHEN name LIKE '/registry/masterleases/%' THEN 'masterleases'
          WHEN name LIKE '/registry/events/%' THEN 'events'
          ELSE 'other'
        END AS prefix,
        count(*) AS revisions
      FROM kine
      GROUP BY 1
    ) t;
  metrics:
    - prefix:
        usage: "LABEL"
        description: "Logical registry family within the kine table."
    - revisions:
        usage: "GAUGE"
        description: "Current number of kine rows for the registry family."

pg_role_activity:
  query: |
    SELECT
      r.rolname AS rolname,
      count(a.pid)::double precision AS connections,
      count(a.pid) FILTER (WHERE a.state = 'idle')::double precision AS idle_connections
    FROM pg_roles r
    LEFT JOIN pg_stat_activity a ON a.usename = r.rolname
    WHERE r.rolcanlogin AND r.rolconnlimit >= 0
    GROUP BY r.rolname;
  metrics:
    - rolname:
        usage: "LABEL"
        description: "Login role that has an explicit CONNECTION LIMIT."
    - connections:
        usage: "GAUGE"
        description: "Backends currently open for the role (compare with pg_roles_connection_limit)."
    - idle_connections:
        usage: "GAUGE"
        description: "Backends of the role currently idle."
