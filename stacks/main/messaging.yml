services:
  rabbitmq:
    image: rabbitmq:4.2.5-alpine
    hostname: cluster-messaging-rabbitmq
    entrypoint: ["/bin/sh", "/etc/messaging/rabbitmq-start.sh"]
    environment:
      RABBITMQ_NODENAME: rabbit@cluster-messaging-rabbitmq
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: '+S 2:2'
    networks: [traefik]
    secrets: [rabbitmq_password]
    configs:
      - {source: rabbitmq_start, target: /etc/messaging/rabbitmq-start.sh}
      - {source: rabbitmq_conf, target: /etc/rabbitmq/rabbitmq.conf}
    volumes: [rabbitmq_data:/var/lib/rabbitmq]
    stop_grace_period: 120s
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, check_running]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 90s
    deploy:
      replicas: 1
      placement:
        constraints: ["node.labels.storage.manager == true", "node.labels.load.tier == light", "node.labels.node.ephemeral != true"]
      resources:
        limits: {memory: 512M, cpus: '1.00'}
      restart_policy: {condition: any, delay: 10s, max_attempts: 0}
      update_config: {order: stop-first, failure_action: rollback, monitor: 60s}
      rollback_config: {order: stop-first, monitor: 60s}
      labels:
        - traefik.enable=true
        - traefik.tcp.routers.messaging-rabbitmq.rule=HostSNI(`rabbitmq.${LOCAL_DOMAIN?err}`)
        - traefik.tcp.routers.messaging-rabbitmq.entrypoints=host-internal
        - traefik.tcp.routers.messaging-rabbitmq.tls=true
        - traefik.tcp.routers.messaging-rabbitmq.tls.certresolver=le-dns
        - traefik.tcp.services.messaging-rabbitmq.loadbalancer.server.port=5672
        - traefik.swarm.network=traefik
  rq-worker:
    image: ghcr.io/astral-sh/uv:0.9.2-python3.12-bookworm-slim
    working_dir: /app
    command: ["/bin/sh", "-c", "uv sync --frozen --no-dev && exec /app/.venv/bin/rq worker --config rq_settings --serializer json --with-scheduler --worker-ttl 90 --disable-job-desc-logging --name $${HOSTNAME} cluster.example.v1"]
    networks: [traefik]
    secrets: [redis_password]
    environment:
      PYTHONPATH: /app
      UV_NO_CACHE: '1'
      RQ_REDIS_HOST: main-storage_redis
      RQ_REDIS_DB: '10'
    configs:
      - {source: worker_project, target: /app/pyproject.toml}
      - {source: worker_lock, target: /app/uv.lock}
      - {source: rq_settings, target: /app/rq_settings.py}
      - {source: jobs_v1, target: /app/jobs_v1.py}
      - {source: health, target: /app/health.py}
    stop_grace_period: 150s
    healthcheck:
      test: [CMD, /app/.venv/bin/python, /app/health.py]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      replicas: 1
      placement:
        constraints: ["node.labels.load.tier == light", "node.labels.node.ephemeral != true"]
      resources:
        limits: {memory: 512M, cpus: '0.50'}
      restart_policy: {condition: any, delay: 10s, max_attempts: 0}
      update_config: {order: stop-first, failure_action: rollback, monitor: 120s}
      rollback_config: {order: stop-first, monitor: 120s}
      labels: ["traefik.enable=false"]
networks:
  traefik: {external: true}
volumes:
  rabbitmq_data: {driver: local}
secrets:
  rabbitmq_password:
    file: ../../secrets/messaging/rabbitmq_password
  redis_password:
    file: ../../secrets/redis/redis_password
configs:
  rabbitmq_start:
    name: messaging_rabbitmq_start-${CONFIG_VERSION:-0}
    file: configs/messaging/rabbitmq-start.sh
  rabbitmq_conf:
    name: messaging_rabbitmq_conf-${CONFIG_VERSION:-0}
    file: configs/messaging/rabbitmq.conf
  worker_project:
    name: messaging_worker_project-${CONFIG_VERSION:-0}
    file: configs/messaging/pyproject.toml
  worker_lock:
    name: messaging_worker_lock-${CONFIG_VERSION:-0}
    file: configs/messaging/uv.lock
  rq_settings:
    name: messaging_rq_settings-${CONFIG_VERSION:-0}
    file: configs/messaging/rq_settings.py
  jobs_v1:
    name: messaging_jobs_v1-${CONFIG_VERSION:-0}
    file: configs/messaging/jobs_v1.py
  health:
    name: messaging_health-${CONFIG_VERSION:-0}
    file: configs/messaging/health.py
