configs:
  blackbox_config:
    name: blackbox_config-${CONFIG_VERSION:-0}
    file: ./configs/blackbox/blackbox.yml
  telegraf_docker_health_config:
    name: telegraf_docker_health_config-${CONFIG_VERSION:-0}
    file: ./configs/telegraf/docker-health.conf
  postgres_exporter_queries:
    name: postgres_exporter_queries-${CONFIG_VERSION:-0}
    file: ./configs/postgres/postgres_exporter_queries.yaml
secrets:
  postgres_exporter_db_password:
    name: postgres_exporter_db_password-${CONFIG_VERSION:-0}
    file: ../../secrets/postgres_exporter/db_password
