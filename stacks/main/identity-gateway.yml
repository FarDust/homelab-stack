version: "3.9"

networks:
  traefik:
    external: true

services:
  pomerium:
    image: pomerium/pomerium:v0.32.0
    command:
      - --config=/pomerium/config.yaml
    networks:
      - traefik
    configs:
      - source: pomerium_config
        target: /pomerium/config.yaml
    extra_hosts:
      - "idp.${LOCAL_DOMAIN?err}:${TRAEFIK_VIP?err}"
    environment:
      - AUTHENTICATE_SERVICE_URL=https://authenticate.${LOCAL_DOMAIN?err}
      - IDP_PROVIDER=oidc
      - IDP_PROVIDER_URL=https://idp.${LOCAL_DOMAIN?err}/realms/${KEYCLOAK_REALM?err}
      - IDP_CLIENT_ID=${POMERIUM_CLIENT_ID?err}
      - IDP_CLIENT_SECRET=${POMERIUM_CLIENT_SECRET?err}
      - COOKIE_SECRET=${POMERIUM_COOKIE_SECRET?err}
      - SHARED_SECRET=${POMERIUM_SHARED_SECRET?err}
      - SIGNING_KEY=${POMERIUM_SIGNING_KEY?err}
      - INSECURE_SERVER=true
      - ADDRESS=:8080
    deploy:
      mode: replicated
      replicas: 0
      restart_policy:
        condition: on-failure
        delay: ${RESTART_DELAY_STANDARD}
        max_attempts: ${RESTART_MAX_ATTEMPTS}
        window: ${RESTART_WINDOW_STANDARD}
      update_config:
        order: stop-first
        failure_action: rollback
        monitor: ${UPDATE_MONITOR_STANDARD}
        max_failure_ratio: 0.3
      rollback_config:
        order: stop-first
        monitor: ${ROLLBACK_MONITOR_STANDARD}
      placement:
        constraints:
          - node.role == worker
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.pomerium-auth.rule=Host(`authenticate.${LOCAL_DOMAIN?err}`)"
        - "traefik.http.routers.pomerium-auth.entrypoints=websecure"
        - "traefik.http.routers.pomerium-auth.tls=true"
        - "traefik.http.routers.pomerium-auth.tls.certresolver=le-dns"
        - "traefik.http.services.pomerium-auth.loadbalancer.server.port=8080"
        - "traefik.http.routers.pomerium-auth.service=pomerium-auth"
        - "traefik.swarm.network=traefik"

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.9.0
    command:
      - --config=/etc/oauth2-proxy/oauth2-proxy.cfg
    networks:
      - traefik
    configs:
      - source: oauth2_proxy_config
        target: /etc/oauth2-proxy/oauth2-proxy.cfg
    extra_hosts:
      - "idp.${LOCAL_DOMAIN?err}:${TRAEFIK_VIP?err}"
    environment:
      - OAUTH2_PROXY_PROVIDER=oidc
      - OAUTH2_PROXY_OIDC_ISSUER_URL=https://idp.${LOCAL_DOMAIN?err}/realms/${KEYCLOAK_SIGILCORE_REALM?err}
      - OAUTH2_PROXY_CLIENT_ID=${OAUTH2_PROXY_CLIENT_ID?err}
      - OAUTH2_PROXY_CLIENT_SECRET=${OAUTH2_PROXY_CLIENT_SECRET?err}
      - OAUTH2_PROXY_COOKIE_SECRET=${OAUTH2_PROXY_COOKIE_SECRET?err}
      - OAUTH2_PROXY_OIDC_EXTRA_AUDIENCE=account
      - OAUTH2_PROXY_REDIRECT_URL=https://oauth2.${LOCAL_DOMAIN?err}/oauth2/callback
      - OAUTH2_PROXY_COOKIE_DOMAINS=.${LOCAL_DOMAIN?err}
      - OAUTH2_PROXY_WHITELIST_DOMAINS=.${LOCAL_DOMAIN?err}
      - OAUTH2_PROXY_HTTP_ADDRESS=0.0.0.0:4180
      - OAUTH2_PROXY_REVERSE_PROXY=true
      - OAUTH2_PROXY_PASS_AUTHORIZATION_HEADER=true
      - OAUTH2_PROXY_SET_AUTHORIZATION_HEADER=true
      - OAUTH2_PROXY_SET_XAUTHREQUEST=true
      - OAUTH2_PROXY_PASS_ACCESS_TOKEN=true
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: ${RESTART_DELAY_STANDARD}
        max_attempts: ${RESTART_MAX_ATTEMPTS}
        window: ${RESTART_WINDOW_STANDARD}
      update_config:
        order: stop-first
        failure_action: rollback
        monitor: ${UPDATE_MONITOR_STANDARD}
        max_failure_ratio: 0.3
      rollback_config:
        order: stop-first
        monitor: ${ROLLBACK_MONITOR_STANDARD}
      placement:
        constraints:
          - node.role == worker
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.oauth2-proxy.rule=Host(`oauth2.${LOCAL_DOMAIN?err}`)"
        - "traefik.http.routers.oauth2-proxy.entrypoints=websecure"
        - "traefik.http.routers.oauth2-proxy.tls=true"
        - "traefik.http.routers.oauth2-proxy.tls.certresolver=le-dns"
        - "traefik.http.routers.oauth2-proxy.service=oauth2-proxy"
        - "traefik.http.services.oauth2-proxy.loadbalancer.server.port=4180"
        - "traefik.swarm.network=traefik"

configs:
  pomerium_config:
    name: pomerium_config-${CONFIG_VERSION:-0}
    file: ./configs/pomerium/config.yml
  oauth2_proxy_config:
    name: oauth2_proxy_config-${CONFIG_VERSION:-0}
    file: ./configs/oauth2-proxy/oauth2-proxy.cfg
