# apps-dist origin; decision record docs/adr/app_distribution_internal_adr.md.
# 8080: read-only repository (GET/HEAD, Range, ETag, Last-Modified). 8081: publisher write path (WebDAV PUT,
# JSON listing; no DELETE or MOVE; PUT over an existing APK is 409) behind basic auth. Temp files share the data volume so a PUT lands with an atomic rename.
pid /tmp/nginx.pid;
worker_processes 2;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format apps '$remote_addr "$request" $status $body_bytes_sent range="$http_range" '
                  'ua="$http_user_agent" rt=$request_time';
  access_log /dev/stdout apps;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  client_body_temp_path /var/cache/nginx/tmp/client 1 2;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080;
    server_name _;
    root /var/cache/nginx/www;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    location = /healthz { access_log off; default_type text/plain; return 200 'ok'; }
    # APK names carry the versionCode and are never replaced (the publish host refuses it), so they are immutable.
    # No `always`: only successful responses (200/206/304) are cacheable, a 404 before publication is not.
    location ~ "^/(repo|archive)/[A-Za-z0-9._-]+\.apk$" {
      limit_except GET HEAD { deny all; }
      add_header Cache-Control 'private, max-age=31536000, immutable';
      add_header X-Content-Type-Options nosniff always;
      try_files $uri =404;
    }
    # Index, icons and signatures change on every publish. nginx validators are mtime+size, which two equal-size indexes
    # written within one second could share, so these small files carry no validator and are always sent in full.
    location ~ "^/(repo|archive)/" {
      limit_except GET HEAD { deny all; }
      etag off;
      if_modified_since off;
      add_header Cache-Control 'no-cache' always;
      add_header X-Content-Type-Options nosniff always;
      try_files $uri =404;
    }
    # metadata/ and quarantine/ are publisher state, not part of the served repository.
    location / { return 404; }
  }

  server {
    listen 8081;
    server_name _;
    root /var/cache/nginx/www;
    client_max_body_size 1g;
    client_body_timeout 300s;
    auth_basic "apps-dist publisher";
    auth_basic_user_file /run/secrets/apps_dist_publisher_htpasswd;
    dav_methods PUT;
    # Reads and PUT only: removal and retention are administrator operations on the node, never this credential.
    location / { limit_except GET HEAD PUT { deny all; } }
    # APKs are create-only: a PUT over an existing APK is refused with 409. Index, icon and state files may be replaced
    # (that is how a publish and a rollback by republishing update the signed index).
    location ~* "\.apk$" {
      limit_except GET HEAD PUT { deny all; }
      set $apk_put "";
      if (-f $request_filename) { set $apk_put "exists"; }
      if ($request_method = PUT) { set $apk_put "${apk_put}-put"; }
      if ($apk_put = "exists-put") { return 409; }
    }
    create_full_put_path on;
    dav_access user:rw group:r all:r;
    # Directory requests always return the JSON listing, even where fdroid wrote an index.html.
    index .apps-dist-listing-only;
    autoindex on;
    autoindex_format json;
    location = /healthz { auth_basic off; access_log off; default_type text/plain; return 200 'ok'; }
  }
}
