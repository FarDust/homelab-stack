server {
    listen 8080;
    server_name _;
    default_type application/json;

    location = /health {
        return 200 '{"status":"ok"}';
    }

    location = /api/tags {
        return 200 '{"models":[]}';
    }

    location = /api/ps {
        return 200 '{"models":[]}';
    }

    location / {
        default_type text/plain;
        return 404 'not found';
    }
}
