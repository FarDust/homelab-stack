# Static OpenAI model list for the scale-to-zero vLLM Gemma engine, served whether or not the engine runs.
# Keep id, root and max_model_len equal to the vllm-gemma4 command; tests/test_vllm_gemma4_read_routes.py checks them.
# Decision: docs/adr/vllm_gemma4_read_routes_adr.md
server {
    listen 8080;
    server_name _;
    default_type application/json;

    location = /v1/models {
        return 200 '{"object":"list","data":[{"id":"gemma-4-31b-it-nvfp4","object":"model","created":1776038400,"owned_by":"vllm","root":"nvidia/Gemma-4-31B-IT-NVFP4","parent":null,"max_model_len":4096}]}';
    }

    location = /v1/models/ {
        return 200 '{"object":"list","data":[{"id":"gemma-4-31b-it-nvfp4","object":"model","created":1776038400,"owned_by":"vllm","root":"nvidia/Gemma-4-31B-IT-NVFP4","parent":null,"max_model_len":4096}]}';
    }

    location = /v1/models/gemma-4-31b-it-nvfp4 {
        return 200 '{"id":"gemma-4-31b-it-nvfp4","object":"model","created":1776038400,"owned_by":"vllm","root":"nvidia/Gemma-4-31B-IT-NVFP4","parent":null,"max_model_len":4096}';
    }

    location /v1/models/ {
        return 404 '{"error":{"message":"The model does not exist.","type":"NotFoundError","param":"model","code":404}}';
    }

    location = /healthz {
        return 200 '{"status":"ok"}';
    }

    location / {
        return 404 '{"error":{"message":"Not found.","type":"NotFoundError","param":null,"code":404}}';
    }
}
