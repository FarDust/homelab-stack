    litellm_params:
      model: chatgpt/gpt-6.1-terra

  - model_name: chatgpt-subscription-sol
    litellm_params:
      model: chatgpt/gpt-6.1-sol
    model_info:
      mode: responses
  - model_name: chatgpt-subscription-luna
    litellm_params:
      model: chatgpt/gpt-6-luna
    model_info:
      mode: responses
