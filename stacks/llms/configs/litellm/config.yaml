litellm_settings:
  vertex_location: "us-central1"
  drop_params: true
  # Wildcard `/v1/models`: ask provider for concrete ids when supported (see
  # https://docs.litellm.ai/docs/proxy/model_discovery — Ollama is not listed there yet).
  check_provider_endpoint: true
  callbacks:
    - langfuse
    - ollama_unload_hook.proxy_handler_instance
    - websearch_interception
  websearch_interception_params:
    enabled_providers:
      - openai
      - anthropic
      - bedrock
    search_tool_name: searxng-search
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]
  cache: True
  cache_params:
    type: redis
    namespace: "litellm.caching.caching"
    ttl: 240
    supported_call_types: ["aembedding"]
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    password: os.environ/REDIS_PASSWORD

router_settings:
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  redis_password: os.environ/REDIS_PASSWORD
  model_group_retry_policy:
    trust-agent-chat: {DefaultRetries: 0, TimeoutErrorRetries: 0}
    trust-agent-chat-low-end: {DefaultRetries: 0, TimeoutErrorRetries: 0}
  # Local-first aliases for automation workloads (e.g. n8n).
  # Existing model names are unchanged; these add stable route targets.
  fallbacks:
    - {"n8n-chat": ["n8n-chat-low-end", "n8n-chat-fallback", "gemini-2.5-flash"]}
    - {"n8n-chat-low-end": ["n8n-chat-fallback", "gemini-2.5-flash"]}
    - {"n8n-code": ["n8n-code-fallback", "gemini-2.5-flash-lite"]}
    - {"trust-agent-chat": ["trust-agent-chat-low-end", "chatgpt-subscription-terra", "chatgpt-subscription-sol"]}
    - {"trust-agent-chat-low-end": ["chatgpt-subscription-terra", "chatgpt-subscription-sol"]}
    - {"gpt-5-chat-latest": ["n8n-chat", "n8n-chat-low-end", "n8n-chat-fallback", "gemini-2.5-flash"]}

search_tools:
  - search_tool_name: searxng-search
    litellm_params:
      search_provider: searxng
      api_base: os.environ/SEARXNG_API_BASE

model_list:
