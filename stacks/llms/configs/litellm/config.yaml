# ---------------------------------------------------------------------------
# MCP Servers — accessible via LiteLLM's /mcp/ gateway endpoint
# ---------------------------------------------------------------------------
mcp_servers:
  # Infrastructure tools exposed through the LiteLLM MCP gateway.
  # Auth uses OAuth2 client credentials from the configured identity provider.
  # Access is restricted to the configured LiteLLM access group.
  cluster_utils_mcp:
    url: os.environ/MCP_CLUSTER_UTILS_URL
    transport: "http"
    auth_type: oauth2
    oauth2_flow: client_credentials
    client_id: os.environ/MCP_GATEWAY_OIDC_CLIENT_ID
    client_secret: os.environ/MCP_GATEWAY_OIDC_CLIENT_SECRET
    token_url: os.environ/MCP_GATEWAY_OIDC_TOKEN_URL
    scopes: ["openid"]
    access_groups: ["infra-admin"]
    description: "Infrastructure tools exposed through the LiteLLM MCP gateway. Requires configured backend services."

  # Grafana dashboards and data queries (no auth — VPN-only)
  mcp_grafana:
    url: os.environ/MCP_GRAFANA_URL
    transport: "http"
    access_groups: ["infra-admin"]
    description: "Grafana dashboard queries and data exploration."

  # Notion workspace (no auth — VPN-only)
  mcp_notion:
    url: os.environ/MCP_NOTION_URL
    transport: "sse"
    access_groups: ["productivity"]
    description: "Notion workspace read/write."

  # Playwright browser automation (no auth — VPN-only)
  mcp_playwright:
    url: os.environ/MCP_PLAYWRIGHT_URL
    transport: "http"
    access_groups: ["infra-admin", "productivity"]
    description: "Browser automation and web scraping."

general_settings:

  store_prompts_in_spend_logs: true
  user_api_key_cache_ttl: 3600
