# promptfoo evaluation configuration
# Docs: https://www.promptfoo.dev/docs/configuration/reference/
#
# This config wires promptfoo to the local LiteLLM proxy so you can:
#   • compare prompt quality across models available in litellm
#   • run regression tests when updating prompts or switching models
#   • use red-team / safety checks against locally-hosted models
#
# Run an evaluation:
#   docker exec -it <promptfoo-container> promptfoo eval
#
# View results in the web UI:
#   https://promptfoo.<LOCAL_DOMAIN>

description: "Homelab LLM evaluation suite"

# ---------------------------------------------------------------------------
# Providers (models reachable via the LiteLLM proxy)
# OPENAI_BASE_URL and OPENAI_API_KEY are injected from the container env.
# ---------------------------------------------------------------------------
providers:
  - id: openai:gpt-4o-mini
    label: gpt-4o-mini (via LiteLLM)
  - id: openai:gemini-2.5-flash
    label: gemini-2.5-flash (via LiteLLM)

# ---------------------------------------------------------------------------
# Prompts
# ---------------------------------------------------------------------------
prompts:
  - "Answer the following question concisely: {{question}}"
  - "You are a helpful assistant. {{question}}"

# ---------------------------------------------------------------------------
# Test cases
# ---------------------------------------------------------------------------
tests:
  - vars:
      question: "What is the capital of France?"
    assert:
      - type: icontains
        value: "Paris"

  - vars:
      question: "What is 2 + 2?"
    assert:
      - type: icontains
        value: "4"

  - vars:
      question: "Name one benefit of using a reverse proxy like Traefik."
    assert:
      - type: llm-rubric
        value: "The answer mentions at least one valid benefit such as TLS termination, routing, or load balancing."
        provider: openai:gpt-4o-mini

# ---------------------------------------------------------------------------
# Output / sharing settings
# ---------------------------------------------------------------------------
sharing:
  # Disable cloud sharing — all results stay local
  apiBaseUrl: ""
